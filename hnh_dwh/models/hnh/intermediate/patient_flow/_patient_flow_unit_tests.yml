version: 2

unit_tests:
  - name: int_episode_picks_primary_rows_deterministically
    description: >
      The eligibility row with the lowest sequence wins, then the lowest id. The active
      bill agreement with the lowest responsibility sequence wins. Episode rank counts
      episodes that exist only in the pre-2022 eligibility history.
    model: int_episode
    given:
      - input: ref('stg_oasis__episodes')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(5) as episode_no,
                 toNullable(toDateTime('2026-03-01 09:00:00', 'Asia/Riyadh')) as started_at,
                 cast(null as Nullable(DateTime('Asia/Riyadh'))) as ended_at,
                 toNullable(toInt64(279)) as eligibility_type
          union all
          select toUInt8(1), toInt64(200), toInt64(1),
                 toNullable(toDateTime('2026-03-02 09:00:00', 'Asia/Riyadh')),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(300), toInt64(1),
                 toNullable(toDateTime('2026-03-03 09:00:00', 'Asia/Riyadh')),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(300), toInt64(2),
                 toNullable(toDateTime('2026-03-04 09:00:00', 'Asia/Riyadh')),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), cast(null as Nullable(Int64))
      - input: ref('stg_oasis__eligibility')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(900) as patient_eligibility_id,
                 toNullable(toInt64(100)) as patient_id, toNullable(toInt64(5)) as episode_no,
                 toNullable(toInt64(2)) as sequence, toNullable('1') as responsibility,
                 toNullable('I') as attendance_type, toNullable('D900') as consultant_staff_id,
                 toNullable(toInt64(10)) as service_dept, toNullable(toInt64(1000)) as work_entity,
                 cast(null as Nullable(Int64)) as eligibility_work_entity, cast(null as Nullable(Int64)) as admission_no
          union all
          select toUInt8(1), toInt64(950), toNullable(toInt64(100)), toNullable(toInt64(5)),
                 toNullable(toInt64(1)), toNullable('1'), toNullable('O'), toNullable('D950'),
                 toNullable(toInt64(11)), toNullable(toInt64(1001)), toNullable(toInt64(2002)), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(10), toNullable(toInt64(100)), toNullable(toInt64(2)),
                 toNullable(toInt64(1)), toNullable('1'), toNullable('E'), toNullable('D010'),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(960), toNullable(toInt64(300)), toNullable(toInt64(2)),
                 toNullable(toInt64(1)), toNullable('1'), toNullable('O'), toNullable('D960'),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64))
      - input: ref('stg_oasis__bill_agreements')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(5) as episode_no,
                 toInt64(2) as responsibility_seq, toNullable(toInt64(300)) as purchaser_code,
                 toNullable(toInt64(30)) as policy_code, toNullable(toInt64(3)) as contract_no, toNullable('I') as status
          union all
          select toUInt8(1), toInt64(100), toInt64(5), toInt64(1), toNullable(toInt64(200)),
                 toNullable(toInt64(20)), toNullable(toInt64(2)), cast(null as Nullable(String))
          union all
          select toUInt8(1), toInt64(100), toInt64(5), toInt64(0), toNullable(toInt64(999)),
                 toNullable(toInt64(99)), toNullable(toInt64(9)), toNullable('C')
    expect:
      rows:
        - {branch_id: 1, patient_id: 100, episode_no: 5, care_type: "OP", has_eligibility: 1, consultant_staff_id: "D950", work_entity: 2002, purchaser_code: 200, policy_code: 20, episode_seq: 2, is_first_episode: 0, previous_care_type: "ER"}
        - {branch_id: 1, patient_id: 200, episode_no: 1, care_type: "Unknown", has_eligibility: 0, consultant_staff_id: null, work_entity: null, purchaser_code: 9999, policy_code: null, episode_seq: 1, is_first_episode: 1, previous_care_type: null}
        - {branch_id: 1, patient_id: 300, episode_no: 1, care_type: "Unknown", has_eligibility: 0, consultant_staff_id: null, work_entity: null, purchaser_code: 9999, policy_code: null, episode_seq: 1, is_first_episode: 1, previous_care_type: null}
        - {branch_id: 1, patient_id: 300, episode_no: 2, care_type: "OP", has_eligibility: 1, consultant_staff_id: "D960", work_entity: null, purchaser_code: 9999, policy_code: null, episode_seq: 2, is_first_episode: 0, previous_care_type: "Unknown"}
  - name: int_bed_day_uses_midnight_census
    description: >
      A bed is occupied on a day when a stay covers the end of that day. A stay that
      starts and ends on the same day occupies no night. An open stay occupies every
      night through yesterday. A day covered by a NOT AVAILABLE row is unavailable.
    model: int_bed_day
    overrides:
      vars:
        hnh_history_start_date: "2022-01-01"
    given:
      - input: ref('stg_oasis__bed_details')
        format: sql
        rows: |
          -- bed A1: stay from 4 days ago 10:00 to 2 days ago 09:00 (two nights)
          select toUInt8(1) as branch_id, toInt64(1) as bed_detail_id, toNullable('N') as is_current,
                 toNullable(toInt64(500)) as work_entity, cast(null as Nullable(Int64)) as room_no,
                 toNullable('A1') as bed_location, toNullable(toInt64(29)) as bed_status,
                 cast(null as Nullable(Int64)) as bed_class,
                 toNullable(toDateTime(today() - 4, 'Asia/Riyadh') + toIntervalHour(10)) as started_at,
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(9)) as ended_at,
                 toNullable(toInt64(100)) as patient_id, toNullable(toInt64(7001)) as admission_no,
                 toNullable(toInt64(1)) as episode_no, cast(null as Nullable(String)) as bed_sex,
                 cast(null as Nullable(Int64)) as transferred_from_work_entity
          union all
          -- bed A2: same-day stay 3 days ago, no night
          select toUInt8(1), toInt64(2), toNullable('N'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A2'), toNullable(toInt64(29)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(8)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(15)),
                 toNullable(toInt64(101)), toNullable(toInt64(7002)), toNullable(toInt64(1)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A3: open stay since 2 days ago
          select toUInt8(1), toInt64(3), toNullable('Y'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A3'), toNullable(toInt64(29)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(20)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 toNullable(toInt64(102)), toNullable(toInt64(7003)), toNullable(toInt64(1)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A4: exists since 3 days ago, out of service from 2 days ago, never occupied
          select toUInt8(1), toInt64(4), toNullable('N'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A4'), toNullable(toInt64(28)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(1)),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(1)),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(5), toNullable('Y'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A4'), toNullable(toInt64(30)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(1)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A1/A2 get a later open row, so they stay open locations
          select toUInt8(1), toInt64(6), toNullable('Y'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A1'), toNullable(toInt64(28)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(9)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(7), toNullable('Y'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A2'), toNullable(toInt64(28)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(15)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A5: retired, only row ended 3 days ago
          select toUInt8(1), toInt64(8), toNullable('N'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A5'), toNullable(toInt64(28)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 6, 'Asia/Riyadh') + toIntervalHour(1)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(1)),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A6: stale open row with an admission, ended by the next row
          select toUInt8(1), toInt64(9), toNullable('N'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A6'), toNullable(toInt64(29)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 5, 'Asia/Riyadh') + toIntervalHour(10)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 toNullable(toInt64(103)), toNullable(toInt64(7004)), toNullable(toInt64(1)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          select toUInt8(1), toInt64(10), toNullable('Y'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A6'), toNullable(toInt64(28)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(12)),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
          union all
          -- bed A7: segment runs 2 days past its admission's physical discharge
          select toUInt8(1), toInt64(11), toNullable('N'), toNullable(toInt64(500)), cast(null as Nullable(Int64)),
                 toNullable('A7'), toNullable(toInt64(29)), cast(null as Nullable(Int64)),
                 toNullable(toDateTime(today() - 6, 'Asia/Riyadh') + toIntervalHour(10)),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(10)),
                 toNullable(toInt64(104)), toNullable(toInt64(7005)), toNullable(toInt64(1)),
                 cast(null as Nullable(String)), cast(null as Nullable(Int64))
      - input: ref('int_bed_segment')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(1) as bed_detail_id, toInt64(7001) as admission_no,
                 toNullable(toInt64(100)) as patient_id, toNullable(toInt64(500)) as work_entity, 'A1' as bed_location,
                 toDateTime(today() - 4, 'Asia/Riyadh') + toIntervalHour(10) as started_at,
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(9)) as ended_at,
                 toUInt8(0) as is_excluded_ward
          union all
          select toUInt8(1), toInt64(2), toInt64(7002), toNullable(toInt64(101)), toNullable(toInt64(500)), 'A2',
                 toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(8),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(15)), toUInt8(0)
          union all
          select toUInt8(1), toInt64(3), toInt64(7003), toNullable(toInt64(102)), toNullable(toInt64(500)), 'A3',
                 toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(20),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), toUInt8(0)
          union all
          select toUInt8(1), toInt64(9), toInt64(7004), toNullable(toInt64(103)), toNullable(toInt64(500)), 'A6',
                 toDateTime(today() - 5, 'Asia/Riyadh') + toIntervalHour(10),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(12)), toUInt8(0)
          union all
          select toUInt8(1), toInt64(11), toInt64(7005), toNullable(toInt64(104)), toNullable(toInt64(500)), 'A7',
                 toDateTime(today() - 6, 'Asia/Riyadh') + toIntervalHour(10),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(10)), toUInt8(0)
      - input: ref('int_admission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(7001) as admission_no,
                 toNullable(toDateTime(today() - 4, 'Asia/Riyadh') + toIntervalHour(10)) as admitted_at,
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(9)) as physical_discharge_at
          union all
          select toUInt8(1), toInt64(7002),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(8)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(15))
          union all
          select toUInt8(1), toInt64(7003),
                 toNullable(toDateTime(today() - 2, 'Asia/Riyadh') + toIntervalHour(20)),
                 cast(null as Nullable(DateTime('Asia/Riyadh')))
          union all
          select toUInt8(1), toInt64(7004),
                 toNullable(toDateTime(today() - 5, 'Asia/Riyadh') + toIntervalHour(10)),
                 toNullable(toDateTime(today() - 3, 'Asia/Riyadh') + toIntervalHour(12))
          union all
          -- A7's admission was discharged 4 days ago at 10:00; its bed row kept running 2 more days
          select toUInt8(1), toInt64(7005),
                 toNullable(toDateTime(today() - 6, 'Asia/Riyadh') + toIntervalHour(10)),
                 toNullable(toDateTime(today() - 4, 'Asia/Riyadh') + toIntervalHour(10))
      - input: ref('int_code_decode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(30) as code, toNullable('NOT AVAILABLE') as description_upper
          union all
          select toUInt8(1), toInt64(28), toNullable('READY FOR USE')
          union all
          select toUInt8(1), toInt64(29), toNullable('IN USE')
      - input: ref('int_department_conformed')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(500) as work_entity, toUInt8(0) as is_excluded_ward, 'IP' as care_setting
    expect:
      format: sql
      rows: |
        select toUInt8(1) as branch_id, 'A1' as bed_location, today() - 4 as date_day, toNullable(toInt64(500)) as work_entity, toUInt8(1) as is_available, toUInt8(1) as is_occupied, toNullable(toInt64(7001)) as admission_no, toNullable(toInt64(100)) as patient_id, toUInt8(0) as is_excluded_ward, toUInt8(1) as is_inpatient_ward
        union all select toUInt8(1), 'A1', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7001)), toNullable(toInt64(100)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A1', today() - 2, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A1', today() - 1, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A2', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A2', today() - 2, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A2', today() - 1, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A3', today() - 2, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7003)), toNullable(toInt64(102)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A3', today() - 1, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7003)), toNullable(toInt64(102)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A4', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A4', today() - 2, toNullable(toInt64(500)), toUInt8(0), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A4', today() - 1, toNullable(toInt64(500)), toUInt8(0), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A5', today() - 6, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A5', today() - 5, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A5', today() - 4, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A5', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A6', today() - 5, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7004)), toNullable(toInt64(103)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A6', today() - 4, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7004)), toNullable(toInt64(103)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A6', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A6', today() - 2, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A6', today() - 1, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A7', today() - 6, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7005)), toNullable(toInt64(104)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A7', today() - 5, toNullable(toInt64(500)), toUInt8(1), toUInt8(1), toNullable(toInt64(7005)), toNullable(toInt64(104)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A7', today() - 4, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A7', today() - 3, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)
        union all select toUInt8(1), 'A7', today() - 2, toNullable(toInt64(500)), toUInt8(1), toUInt8(0), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toUInt8(0), toUInt8(1)

  - name: int_admission_rules
    description: >
      Open stay, short stay, wrong-admission outcome, last bed in an excluded ward,
      30-day readmission measured from the previous discharge, and ICU readmission
      measured in hours between Critical beds.
    model: int_admission
    given:
      - input: ref('stg_oasis__admissions')
        format: sql
        rows: |
          -- patient 100: stay 1 (10 days), stay 2 admitted 30 days after stay 1's discharge, stay 3 admitted 31 days after stay 2's discharge
          select toUInt8(1) as branch_id, toInt64(1) as admission_no, toNullable(toInt64(100)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toDateTime('2026-01-01 10:00:00', 'Asia/Riyadh')) as admitted_at,
                 cast(null as Nullable(DateTime('Asia/Riyadh'))) as seen_at, cast(null as Nullable(DateTime('Asia/Riyadh'))) as estimated_discharge_at,
                 cast(null as Nullable(DateTime('Asia/Riyadh'))) as clinical_discharge_at,
                 toNullable(toDateTime('2026-01-11 10:00:00', 'Asia/Riyadh')) as physical_discharge_at,
                 cast(null as Nullable(DateTime('Asia/Riyadh'))) as financial_discharge_at,
                 toNullable(toInt64(90)) as status_code, toNullable(toInt64(33)) as outcome_code, cast(null as Nullable(Int64)) as bed_class,
                 cast(null as Nullable(Int64)) as referred_type_code, cast(null as Nullable(Int64)) as admission_mode_code,
                 toNullable('D1') as treating_staff_id
          union all
          select toUInt8(1), toInt64(2), toNullable(toInt64(100)), toNullable(toInt64(2)),
                 toNullable(toDateTime('2026-02-10 09:00:00', 'Asia/Riyadh')), cast(null as Nullable(DateTime('Asia/Riyadh'))), cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), toNullable(toDateTime('2026-02-12 09:00:00', 'Asia/Riyadh')), cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 toNullable(toInt64(90)), toNullable(toInt64(33)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), cast(null as Nullable(Int64)), toNullable('D1')
          union all
          select toUInt8(1), toInt64(3), toNullable(toInt64(100)), toNullable(toInt64(3)),
                 toNullable(toDateTime('2026-03-15 09:00:00', 'Asia/Riyadh')), cast(null as Nullable(DateTime('Asia/Riyadh'))), cast(null as Nullable(DateTime('Asia/Riyadh'))),
                 cast(null as Nullable(DateTime('Asia/Riyadh'))), toNullable(toDateTime('2026-03-16 09:00:00', 'Asia/Riyadh')), cast(null as Nullable(DateTime('Asia/Riyadh'))),
