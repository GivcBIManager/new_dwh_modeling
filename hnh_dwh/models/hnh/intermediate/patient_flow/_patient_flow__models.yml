version: 2

models:
  - name: int_episode
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_id, episode_no]
    columns:
      - name: care_type
        tests:
          - accepted_values:
              values: ["OP", "ER", "IP", "DAYCASE", "Unknown"]
      - name: purchaser_code
        tests: [not_null]
      - name: episode_seq
        tests: [not_null]
  - name: int_bed_segment
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_detail_id]
    columns:
      - name: admission_no
        tests: [not_null]
      - name: started_at
        tests: [not_null]
  - name: int_bed_day
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_location, date_day]
  - name: int_admission
    tests:
      - hnh_unique_combination:
          columns: [branch_id, admission_no]
    columns:
      - name: admission_source
        tests:
          - accepted_values:
              values: ["OP", "ER", "Direct"]
      - name: discharge_outcome_group
        tests:
          - accepted_values:
              values: ["Normal discharge", "Left against advice", "Died", "Transferred out", "Transferred to another episode", "Wrong admission", "Absconded", "Other", "Not recorded"]

  - name: int_encounter
    tests:
      - hnh_unique_combination:
          columns: [branch_id, encounter_type, source_id]
    columns:
      - name: encounter_at
        tests: [not_null]
      - name: encounter_type
        tests:
          - accepted_values:
              values: ["OP", "ER", "IP"]
      - name: care_type
        tests:
          - accepted_values:
              values: ["OP", "ER", "IP", "DAYCASE"]
      - name: visit_type
        tests:
          - accepted_values:
              values: ["New patient", "Free follow-up", "Paid visit"]
