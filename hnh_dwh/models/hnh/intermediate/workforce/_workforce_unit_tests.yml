version: 2

unit_tests:
  - name: int_legal_employer_branch_resolves_names
    description: '"HNH Abha" resolves through business unit "Abha" and its ledger to branch 6; Head Office to 100; an unknown employer to 0.'
    model: int_legal_employer_branch
    given:
      - input: ref('stg_fusion__organizations')
        format: sql
        rows: |
          select toInt64(o) as organization_id, toNullable(n) as organization_name, toNullable('HCM_LEMP,HCM_PSU') as classification_codes
          from values('o UInt32, n String', (1, 'HNH Abha'), (2, 'HNH Head Office'), (3, 'HNH Nowhere'))
      - input: ref('stg_fusion__business_units')
        format: sql
        rows: |
          select toInt64(b) as business_unit_id, toNullable(n) as business_unit_name, toNullable(toInt64(l)) as primary_ledger_id
          from values('b UInt32, n String, l UInt64', (10, 'Abha', 300000005003384), (11, 'Head Office', 300000005003375))
      - input: ref('hnh_dim_branch')
        format: sql
        rows: |
          select toUInt8(k) as branch_key, toNullable(toInt64(l)) as fusion_ledger_id
          from values('k UInt8, l UInt64', (6, 300000005003384), (100, 300000005003375))
    expect:
      rows:
        - {legal_employer_id: 1, branch_key: 6}
        - {legal_employer_id: 2, branch_key: 100}
        - {legal_employer_id: 3, branch_key: 0}

  - name: int_assignment_month_end_picks_one_assignment
    description: >
      Window January–March 2026. Person 1 changes job on 2026-01-16 (two history rows): January takes the row valid on
      31 January (job 20). Person 2 is INACTIVE in February (kept here with its status; the fact drops it). Person 3 has
      two primary active assignments: the one with the later valid_from (assignment 31) wins. Person 1 has an FTE
      measure of 0.5 from February; values outside (0, 1.5] or missing give 1.
    model: int_assignment_month_end
    overrides:
      vars:
        hnh_hr_snapshot_start: "2026-01-01"
        hnh_hr_snapshot_end: "2026-03-31"
    given:
      - input: ref('stg_fusion__assignments')
        format: sql
        rows: |
          select toInt64(a) as assignment_id, toDate32(vf) as valid_from, toDate32(vt) as valid_to, toNullable(toInt64(p)) as person_id,
                 toNullable('E') as assignment_type, toNullable(st) as assignment_status, toUInt8(1) as is_primary,
                 toNullable(toInt64(900)) as organization_id, toNullable(toInt64(j)) as job_id, cast(null as Nullable(Int64)) as position_id,
                 cast(null as Nullable(Int64)) as grade_id, cast(null as Nullable(Int64)) as location_id, toNullable(toInt64(1)) as legal_employer_id
          from values('a UInt32, vf String, vt String, p UInt32, st String, j UInt32',
              (11, '2025-01-01', '2026-01-15', 1, 'ACTIVE', 10), (11, '2026-01-16', '2299-12-31', 1, 'ACTIVE', 20),
              (21, '2025-01-01', '2026-01-31', 2, 'ACTIVE', 10), (21, '2026-02-01', '2026-02-28', 2, 'INACTIVE', 10),
              (21, '2026-03-01', '2299-12-31', 2, 'ACTIVE', 10),
              (30, '2024-01-01', '2299-12-31', 3, 'ACTIVE', 10), (31, '2025-06-01', '2299-12-31', 3, 'ACTIVE', 30))
      - input: ref('stg_fusion__work_measures')
        format: sql
        rows: |
          select toInt64(m) as assign_work_measure_id, toNullable(toInt64(a)) as assignment_id, toNullable(u) as unit,
                 toFloat64(v) as value, toDate32(s) as effective_start_date, toDate32('2299-12-31') as effective_end_date
          from values('m UInt32, a UInt32, u String, v Float64, s String', (1, 11, 'FTE', 0.5, '2026-02-01'), (2, 21, 'FTE', 0, '2025-01-01'))
      - input: ref('int_legal_employer_branch')
        format: sql
        rows: |
          select toInt64(1) as legal_employer_id, toUInt8(6) as branch_key
    expect:
      rows:
        - {person_id: 1, month_end: 2026-01-31, assignment_id: 11, job_id: 20, assignment_status: ACTIVE, branch_key: 6, fte: 1}
        - {person_id: 1, month_end: 2026-02-28, assignment_id: 11, job_id: 20, assignment_status: ACTIVE, branch_key: 6, fte: 0.5}
        - {person_id: 1, month_end: 2026-03-31, assignment_id: 11, job_id: 20, assignment_status: ACTIVE, branch_key: 6, fte: 0.5}
        - {person_id: 2, month_end: 2026-01-31, assignment_id: 21, job_id: 10, assignment_status: ACTIVE, branch_key: 6, fte: 1}
        - {person_id: 2, month_end: 2026-02-28, assignment_id: 21, job_id: 10, assignment_status: INACTIVE, branch_key: 6, fte: 1}
        - {person_id: 2, month_end: 2026-03-31, assignment_id: 21, job_id: 10, assignment_status: ACTIVE, branch_key: 6, fte: 1}
        - {person_id: 3, month_end: 2026-01-31, assignment_id: 31, job_id: 30, assignment_status: ACTIVE, branch_key: 6, fte: 1}
        - {person_id: 3, month_end: 2026-02-28, assignment_id: 31, job_id: 30, assignment_status: ACTIVE, branch_key: 6, fte: 1}
        - {person_id: 3, month_end: 2026-03-31, assignment_id: 31, job_id: 30, assignment_status: ACTIVE, branch_key: 6, fte: 1}

  - name: int_oasis_payroll_line_keeps_latest_run
    description: >
      Branch 1, September 2026, open, 6 staff. All 6 are calculated on 21 Sep; A and D again on 24 Sep (2 of 6, a full
      run); A alone on 26 Sep (1 of 6, below 20%, not a full run). A keeps its 26 Sep calculation and its 10 Sep loan (a
      date with no calculation) but not its 24 Sep housing (a superseded calculation); D keeps 24 Sep; C, E, F and G were
      calculated only before the last full run (leftovers) and are dropped. Branch 2 closed on 1 Oct: B keeps only its
      closed lines; H, calculated on 21 Sep and left out of the close, is dropped. A status X line is ignored. A's loan is
      paid by QuickPay (payment method Q), so it is not a payroll payment.
    model: int_oasis_payroll_line
    given:
      - input: ref('stg_oasis__payroll_transactions')
        format: sql
        rows: |
          select toUInt8(b) as branch_id, toInt64(n) as account_transaction_no, toNullable(st) as staff_id, toInt32(202609) as payroll_month,
                 t as trx_type, 'P' as payable_type, toNullable(s) as status, 'Y' as pay_in_payroll, if(n = 4, 'Q', 'R') as payment_method,
                 toFloat64(a) as amount, toNullable(toDate(d)) as transaction_date
          from values('b UInt8, n UInt32, st String, t String, s String, a Float64, d String',
              (1, 1, 'A', 'BASIC', 'P', 100, '2026-09-21'), (1, 2, 'A', 'BASIC', 'P', 110, '2026-09-24'), (1, 3, 'A', 'BASIC', 'P', 120, '2026-09-26'),
              (1, 4, 'A', 'LOAN', 'P', -50, '2026-09-10'), (1, 5, 'A', 'HOUSING', 'P', 20, '2026-09-24'), (1, 6, 'C', 'BASIC', 'P', 300, '2026-09-21'),
              (1, 7, 'D', 'BASIC', 'P', 400, '2026-09-21'), (1, 8, 'D', 'BASIC', 'P', 410, '2026-09-24'), (1, 9, 'E', 'BASIC', 'P', 500, '2026-09-21'),
              (1, 10, 'F', 'BASIC', 'P', 600, '2026-09-21'), (1, 11, 'G', 'BASIC', 'P', 700, '2026-09-21'),
              (2, 12, 'B', 'BASIC', 'P', 200, '2026-09-21'), (2, 13, 'B', 'BASIC', 'C', 200, '2026-10-01'), (2, 14, 'B', 'STAFF GOSI', 'C', -20, '2026-10-01'),
              (2, 15, 'H', 'BASIC', 'P', 250, '2026-09-21'), (2, 16, 'B', 'BASIC', 'X', 999, '2026-10-01'))
    expect:
      rows:
        - {branch_id: 1, account_transaction_no: 3, is_closed_payroll: 0, open_run_date: '2026-09-26', is_payroll_payment: 1}
        - {branch_id: 1, account_transaction_no: 4, is_closed_payroll: 0, open_run_date: '2026-09-26', is_payroll_payment: 0}
        - {branch_id: 1, account_transaction_no: 8, is_closed_payroll: 0, open_run_date: '2026-09-24', is_payroll_payment: 1}
        - {branch_id: 2, account_transaction_no: 13, is_closed_payroll: 1, open_run_date: null, is_payroll_payment: 1}
        - {branch_id: 2, account_transaction_no: 14, is_closed_payroll: 1, open_run_date: null, is_payroll_payment: 1}

  - name: int_oasis_leave_balance_monthly_contract_balance
    description: >
      Employee 1 (staff A at branch 2): contract 501 from 2025-01-01 with 30 leave days a year, contract 502 from
      2026-04-01 with 21. March 2026 uses contract 501: 455 days earned x 30 / 365 = 37.3973, minus the 7 days up to
      31 March of a 10-day annual leave from 25 March → 30.3973 (begin 34.8493 = 424 days earned, accrued 2.5479).
      April uses contract 502, which starts at zero: 30 days x 21 / 365 = 1.726 earned, a 5-day annual leave taken
      → -3.274; its sick leave and a status O annual leave do not count. Employee 2's contract has no leave days and
      employee 3 has no Oasis staff: no rows.
    model: int_oasis_leave_balance_monthly
    given:
      - input: ref('fact_headcount_monthly')
        format: sql
        rows: |
          select toInt64(e) as employee_key, toUInt8(2) as branch_key, toInt64(s) as staff_key, toDate(m) as month_end
          from values('e UInt32, s Int32, m String',
              (1, 71, '2026-03-31'), (1, 71, '2026-04-30'), (2, 72, '2026-04-30'), (3, -1, '2026-04-30'))
      - input: ref('dim_staff')
        format: sql
        rows: |
          select toInt64(s) as staff_key, toUInt8(2) as branch_key, toNullable(i) as staff_id
          from values('s UInt32, i String', (71, 'A'), (72, 'B'))
      - input: ref('stg_oasis__staff_contracts')
        format: sql
        rows: |
          select toUInt8(2) as branch_id, toInt64(c) as staff_contract_no, toNullable(i) as staff_id, toNullable(toDate32(st)) as started_at,
                 cast(null as Nullable(Date32)) as terminated_at, toFloat64(d) as leave_days
          from values('c UInt32, i String, st String, d Float64', (501, 'A', '2025-01-01', 30), (502, 'A', '2026-04-01', 21),
              (503, 'B', '2025-01-01', 0))
      - input: ref('stg_oasis__staff_vacations')
        format: sql
        rows: |
          select toUInt8(2) as branch_id, toInt64(v) as staff_vacation_id, toNullable(toInt64(c)) as staff_contract_no,
                 toNullable(toInt64(t)) as vacation_type_id, toNullable(toDate32(f)) as from_date, toFloat64(d) as days,
                 toNullable(st) as status
          from values('v UInt32, c UInt32, t UInt32, f String, d Float64, st String',
              (1, 501, 36, '2026-03-25', 10, 'P'), (2, 502, 36, '2026-04-20', 5, 'P'), (3, 502, 40, '2026-04-10', 3, 'P'),
              (4, 502, 36, '2026-04-06', 4, 'O'))
      - input: ref('stg_oasis__vacation_types')
        format: sql
        rows: |
          select toUInt8(2) as branch_id, toInt64(t) as vacation_type_id, toUInt8(a) as is_annual_leave
          from values('t UInt32, a UInt8', (36, 1), (40, 0))
    expect:
      rows:
        - {employee_key: 1, month_end: 2026-03-31, staff_contract_no: 501, begin_balance: 34.8493, accrued: 2.5479, used: 7, end_balance: 30.3973}
        - {employee_key: 1, month_end: 2026-04-30, staff_contract_no: 502, begin_balance: 0, accrued: 1.726, used: 5, end_balance: -3.274}
