version: 2

models:
  - name: int_legal_employer_branch
    columns:
      - name: legal_employer_id
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
  - name: int_employee_period
    columns:
      - name: person_id
        tests: [unique, not_null]
  - name: int_assignment_month_end
    tests:
      - hnh_unique_combination:
          columns: [person_id, month_end]
  - name: int_oasis_payroll_line
    tests:
      - hnh_unique_combination:
          columns: [branch_id, account_transaction_no]
    columns:
      - name: open_run_date
        description: Latest calculation date of the staff for open (status P) lines; null for closed lines.
      - name: is_payroll_payment
        description: 1 for a line paid through the payroll (pay in payroll Y, payment method C or R); 0 for QuickPay and off-payroll lines.
  - name: int_oasis_leave_balance_monthly
    description: >
      Oasis annual-leave balance per employee at each headcount month-end: leave earned in the current Oasis contract
      (no_of_days_leave per 365 days served) minus annual leave taken against it. fact_leave_balance_monthly uses it
      where Fusion has no annual-leave balance for the employee and month.
    tests:
      - hnh_unique_combination:
          columns: [employee_key, month_end]
  - name: int_oasis_absence_entry
    description: >
      Oasis absences (staff_vacations) from hnh_history_start_date for fact_absence and fact_absence_daily: from_date to
      to_date (without one, from_date plus the days rounded up), status O left out, the branch's vacation type, the
      staff's Fusion employee or -1. Entries overlapping a counted day-unit Fusion absence of the same employee are left out.
    tests:
      - hnh_unique_combination:
          columns: [branch_id, staff_vacation_id]
