version: 2

unit_tests:
  - name: int_preauth_line_picks_final_response_and_latest_request
    description: >
      A1 was sent twice: PENDED, then APPROVED, then a later ERROR; the final answer is APPROVED.
      A2 (another service, same episode) was never sent and is rejected in Oasis; it stays the latest
      request for its service although A3 is a later request in the episode. A3 is sent in Oasis (S+N)
      with no NPHIES answer. Item 3 has no Oasis line, so it is its own NPHIES-only line.
      A4 is approved by NPHIES and then gets a later COMPLETE header (a transport status, not a
      payer decision); the final answer stays APPROVED.
      A5 has one response whose item appears twice (PENDED then APPROVED): the item row with the
      highest id is kept, so it is one response with final answer APPROVED.
      V7001-R1 is a payer advance authorisation for the same patient and episode as A1-A3: its answer comes from
      int_nphies_advance_authorisation, its request flags are 0 and it leaves the flags of A1-A3 unchanged.
    model: int_preauth_line
    given:
      - input: ref('stg_oasis__authorisations')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(a) as authorisation_no, toNullable(toInt64(req)) as request_no,
                 toNullable(toInt64(p)) as patient_id, toNullable(toInt64(1)) as episode_no, toNullable(toInt64(ios)) as ios,
                 toNullable(toFloat64(2)) as requested_qty, toNullable(toFloat64(2)) as authorised_qty,
                 toNullable(toFloat64(0)) as used_qty, toNullable(flag) as authorised_flag,
                 toNullable(toFloat64(0)) as amount_authorised, toUInt8(0) as is_transfer,
                 cast(null as Nullable(String)) as com_req_id
          from values('a UInt32, req UInt32, p UInt32, ios UInt32, flag String',
              (1, 10, 100, 500, 'Y'), (2, 11, 100, 600, 'R'), (3, 12, 100, 500, 'N'), (4, 14, 300, 800, 'Y'),
              (5, 15, 400, 900, 'N'))
      - input: ref('stg_oasis__authorisation_requests')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(req) as request_no,
                 toNullable(toDateTime('2026-06-01 09:00:00', 'Asia/Riyadh')) as requested_at, toNullable('S') as request_status
          from values('req UInt32', (10), (11), (12), (14), (15))
      - input: ref('stg_oasis__preauth_api_requests')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(t) as api_trans_id, toNullable(toInt64(req)) as oasis_request_no,
                 toNullable(toInt64(p)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toInt64(300)) as purchaser_code, cast(null as Nullable(Int64)) as service_dept,
                 cast(null as Nullable(String)) as physician_staff_id, cast(null as Nullable(String)) as treatment_type,
                 cast(null as Nullable(String)) as diagnosis_code, toUInt8(0) as is_transfer,
                 toNullable(toDateTime(sent, 'Asia/Riyadh')) as sent_at
          from values('t UInt32, req UInt32, p UInt32, sent String',
              (1001, 10, 100, '2026-06-01 09:10:00'), (1002, 10, 100, '2026-06-01 09:40:00'), (1003, 13, 200, '2026-06-01 10:00:00'),
              (1004, 14, 300, '2026-06-01 10:50:00'),
              (1005, 15, 400, '2026-06-01 12:50:00'))
      - input: ref('stg_oasis__preauth_api_request_items')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as request_item_id, toNullable(toInt64(t)) as api_trans_id,
                 toNullable('1') as item_no, toNullable(toInt64(ios)) as ios, toNullable(toInt64(a)) as authorisation_no,
                 toNullable(toFloat64(1)) as quantity, toNullable(toFloat64(cost)) as estimated_cost
          from values('id UInt32, t UInt32, ios UInt32, a UInt32, cost Float64',
              (1, 1001, 500, 1, 200), (2, 1002, 500, 1, 200), (3, 1003, 700, 999, 50), (4, 1004, 800, 4, 100),
              (5, 1005, 900, 5, 80))
      - input: ref('stg_oasis__preauth_api_responses')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(r) as response_id, toNullable(toInt64(t)) as api_trans_id,
                 toNullable(toDateTime(at, 'Asia/Riyadh')) as responded_at, toNullable(st) as auth_status
          from values('r UInt32, t UInt32, at String, st String',
              (1, 1001, '2026-06-01 09:20:00', 'PENDED'), (2, 1002, '2026-06-01 09:50:00', 'APPROVED'),
              (3, 1002, '2026-06-01 10:30:00', 'ERROR BY NPHIES'), (4, 1003, '2026-06-01 10:10:00', 'REJECTED'),
              (5, 1004, '2026-06-01 11:00:00', 'APPROVED'), (6, 1004, '2026-06-01 12:00:00', 'COMPLETE'),
              (7, 1005, '2026-06-01 13:00:00', 'PENDED'))
      - input: ref('stg_oasis__preauth_api_response_items')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as response_item_id, toNullable(toInt64(r)) as response_id,
                 toNullable('1') as item_no, toNullable(st) as status, toNullable(toFloat64(1)) as approved_quantity,
                 toNullable(toFloat64(amt)) as approved_amount, cast(null as Nullable(String)) as payer_comment
          from values('id UInt32, r UInt32, st String, amt Float64', (11, 1, 'PENDED', 0), (12, 2, 'APPROVED', 180), (14, 4, 'REJECTED', 0),
              (15, 5, 'APPROVED', 90),
              (21, 7, 'PENDED', 0), (22, 7, 'APPROVED', 70))
      - input: ref('int_nphies_adjudication')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(r) as response_id, toNullable(toInt64(t)) as about_api_trans_id,
                 toInt64(1) as item_sequence, 'Pre-authorisation' as response_kind, oc as outcome,
                 toNullable(toDateTime(at, 'Asia/Riyadh')) as responded_at,
                 if(rc = '', cast([] as Array(String)), [rc]) as reason_codes,
                 if(rc = '', cast(null as Nullable(String)), toNullable(rc)) as primary_reason_code,
                 toNullable(toFloat64(elg)) as eligible, toNullable(toFloat64(ben)) as benefit,
                 toNullable(ref) as preauth_reference,
                 toNullable(toDate('2026-06-01')) as preauth_valid_from, toNullable(toDate('2026-07-01')) as preauth_valid_to
          from values('r UInt32, t UInt32, oc String, at String, rc String, elg Float64, ben Float64, ref String',
              (5001, 1001, 'Pended', '2026-06-01 09:20:00', '', 0, 0, 'PA-0'),
              (5002, 1002, 'Partially approved', '2026-06-01 09:50:00', 'BE-1-6', 200, 180, 'PA-1'),
              (5004, 1003, 'Rejected', '2026-06-01 10:10:00', 'MN-1-1', 0, 0, 'PA-2'))
      - input: ref('int_nphies_advance_authorisation')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, 'V7001-R1' as line_natural_id, toNullable(toInt64(100)) as patient_id,
                 toNullable(toInt64(1)) as episode_no, toNullable(toInt64(300)) as purchaser_code,
                 toNullable(toDateTime('2026-06-01 08:00:00', 'Asia/Riyadh')) as created_at, toNullable(toFloat64(200)) as submitted_amount,
                 toUInt64(3) as pull_count, toNullable('APPROVED') as nphies_status, 'Approved' as outcome,
                 toNullable(toDateTime('2026-06-02 10:00:00', 'Asia/Riyadh')) as responded_at, toNullable(toFloat64(150)) as approved_amount,
                 cast(null as Nullable(Float64)) as eligible_amount, 'R1' as preauth_reference,
                 toNullable(toDate('2026-06-01')) as preauth_valid_from, toNullable(toDate('2026-06-30')) as preauth_valid_to,
                 toNullable('referral') as advance_reason, '7001' as payer_license, cast(null as Nullable(String)) as referring_provider_name,
                 toNullable('OP') as care_type, toNullable('Validity period') as episode_link_method, toUInt32(1) as episode_match_count
    expect:
      rows:
        - {line_natural_id: A1, line_source: Oasis, preauth_outcome: Approved, nphies_final_status: APPROVED, nphies_first_status: PENDED, nphies_last_status: ERROR BY NPHIES, response_count: 3, request_send_count: 2, nphies_approved_amount: 180, is_latest_request_for_service: 0, legacy_is_last_request: 0, primary_reason_code: BE-1-6, payer_approved_amount: 180, preauth_reference: PA-1, payer_license: null, pull_count: null}
        - {line_natural_id: A2, line_source: Oasis, preauth_outcome: Rejected, nphies_final_status: null, nphies_first_status: null, nphies_last_status: null, response_count: 0, request_send_count: 0, nphies_approved_amount: null, is_latest_request_for_service: 1, legacy_is_last_request: 0, primary_reason_code: null, payer_approved_amount: null, preauth_reference: null, payer_license: null, pull_count: null}
        - {line_natural_id: A3, line_source: Oasis, preauth_outcome: Pended, nphies_final_status: null, nphies_first_status: null, nphies_last_status: null, response_count: 0, request_send_count: 0, nphies_approved_amount: null, is_latest_request_for_service: 1, legacy_is_last_request: 1, primary_reason_code: null, payer_approved_amount: null, preauth_reference: null, payer_license: null, pull_count: null}
        - {line_natural_id: N1003-1, line_source: NPHIES only, preauth_outcome: Rejected, nphies_final_status: REJECTED, nphies_first_status: REJECTED, nphies_last_status: REJECTED, response_count: 1, request_send_count: 1, nphies_approved_amount: 0, is_latest_request_for_service: 1, legacy_is_last_request: 1, primary_reason_code: MN-1-1, payer_approved_amount: 0, preauth_reference: PA-2, payer_license: null, pull_count: null}
        - {line_natural_id: A4, line_source: Oasis, preauth_outcome: Approved, nphies_final_status: APPROVED, nphies_first_status: APPROVED, nphies_last_status: COMPLETE, response_count: 2, request_send_count: 1, nphies_approved_amount: 90, is_latest_request_for_service: 1, legacy_is_last_request: 1, primary_reason_code: null, payer_approved_amount: null, preauth_reference: null, payer_license: null, pull_count: null}
        - {line_natural_id: A5, line_source: Oasis, preauth_outcome: Approved, nphies_final_status: APPROVED, nphies_first_status: APPROVED, nphies_last_status: APPROVED, response_count: 1, request_send_count: 1, nphies_approved_amount: 70, is_latest_request_for_service: 1, legacy_is_last_request: 1, primary_reason_code: null, payer_approved_amount: null, preauth_reference: null, payer_license: null, pull_count: null}
        - {line_natural_id: V7001-R1, line_source: Payer advance, preauth_outcome: Approved, nphies_final_status: APPROVED, nphies_first_status: APPROVED, nphies_last_status: APPROVED, response_count: 3, request_send_count: 0, nphies_approved_amount: 150, is_latest_request_for_service: 0, legacy_is_last_request: 0, primary_reason_code: null, payer_approved_amount: 150, preauth_reference: R1, payer_license: '7001', pull_count: 3}
