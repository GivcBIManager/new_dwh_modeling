          union all
          select toUInt8(1), toInt64(102), 'advanced-authorization', toNullable('APPROVED'), toNullable(toDateTime('2026-06-02 10:00:00', 'Asia/Riyadh')),
                 '{"resourceType":"Bundle","entry":[{"fullUrl":"urn:mh","resource":{"resourceType":"MessageHeader","eventCoding":{"code":"advanced-authorization"},"sender":{"type":"Organization","identifier":{"value":"7001"}}}},{"fullUrl":"urn:cr","resource":{"resourceType":"ClaimResponse","identifier":[{"value":"CR-R1"}],"type":{"coding":[{"code":"professional"}]},"subType":{"coding":[{"code":"op"}]},"use":"preauthorization","patient":{"reference":"urn:pat"},"insurer":{"reference":"urn:ins"},"created":"2026-06-01T09:00:00.00+03:03","outcome":"complete","preAuthRef":"R1","preAuthPeriod":{"start":"2026-06-01T00:00:00+03:00","end":"2026-06-30"},"extension":[{"url":"http://nphies.sa/fhir/ksa/nphies-fs/StructureDefinition/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"approved"}]}},{"url":"http://nphies.sa/fhir/ksa/nphies-fs/StructureDefinition/extension-advancedAuth-reason","valueCodeableConcept":{"coding":[{"code":"referral"}]}},{"url":"http://nphies.sa/fhir/ksa/nphies-fs/StructureDefinition/extension-referringProvider","valueReference":{"display":"CLINIC X"}}],"total":[{"category":{"coding":[{"code":"benefit"}]},"amount":{"value":150}},{"category":{"coding":[{"code":"submitted"}]},"amount":{"value":200}}],"addItem":[{"extension":[{"url":"http://nphies.sa/fhir/ksa/nphies-fs/StructureDefinition/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"approved"}]}},{"url":"x/extension-sequence","valuePositiveInt":1}],"productOrService":{"coding":[{"code":"S1"}]},"adjudication":[{"category":{"coding":[{"code":"benefit"}]},"amount":{"value":140}},{"category":{"coding":[{"code":"submitted"}]},"amount":{"value":200}}]}]}},{"fullUrl":"urn:pat","resource":{"resourceType":"Patient","identifier":[{"type":{"coding":[{"code":"NI"}]},"value":"111"}]}}]}'
          union all
