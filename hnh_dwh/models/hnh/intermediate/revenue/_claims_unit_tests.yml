version: 2

unit_tests:
  - name: int_nphies_adjudication_parses_claim_items
    description: >
      One claim-response bundle with a MessageHeader, a ClaimResponse with two items and a Patient
      resource (ignored). Item 1 is partial with two reason codes on the benefit adjudication; item 2
      is approved. One priorauth-response with a preAuthRef and period. One payment reconciliation
      (not an adjudication; must produce no row).
    model: int_nphies_adjudication
    given:
      - input: ref('stg_oasis__pull_responses')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(9001) as response_id, toNullable(toInt64(1)) as api_trans_id,
                 toNullable(toInt64(7001)) as about_api_trans_id, 'claim-response' as response_type,
                 toNullable('PARTIAL') as res_status, toNullable('SUCCEEDED') as status,
                 toNullable(toDateTime('2026-06-02 10:00:00', 'Asia/Riyadh')) as responded_at,
                 '{"resourceType":"Bundle","entry":[{"resource":{"resourceType":"MessageHeader"}},{"resource":{"resourceType":"ClaimResponse","item":[{"itemSequence":1,"extension":[{"url":"http://nphies.sa/fhir/ksa/nphies-fs/StructureDefinition/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"partial"}]}}],"adjudication":[{"category":{"coding":[{"code":"submitted"}]},"amount":{"value":100}},{"category":{"coding":[{"code":"eligible"}]},"amount":{"value":80}},{"category":{"coding":[{"code":"benefit"}]},"reason":{"coding":[{"code":"BE-1-7"},{"code":"MN-1-1"}]},"amount":{"value":64}},{"category":{"coding":[{"code":"copay"}]},"amount":{"value":16}},{"category":{"coding":[{"code":"approved-quantity"}]},"value":2}]},{"itemSequence":2,"extension":[{"url":"x/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"approved"}]}}],"adjudication":[{"category":{"coding":[{"code":"submitted"}]},"amount":{"value":30}},{"category":{"coding":[{"code":"eligible"}]},"amount":{"value":30}},{"category":{"coding":[{"code":"benefit"}]},"amount":{"value":24}},{"category":{"coding":[{"code":"copay"}]},"amount":{"value":6}}]}]}},{"resource":{"resourceType":"Patient","name":[{"text":"MUST NOT APPEAR"}]}}]}' as response_bundle
          union all
          select toUInt8(1), toInt64(9101), toNullable(toInt64(2)), toNullable(toInt64(8001)), 'priorauth-response',
                 toNullable('REJECTED'), toNullable('P'), toNullable(toDateTime('2026-06-03 09:00:00', 'Asia/Riyadh')),
                 '{"entry":[{"resource":{"resourceType":"ClaimResponse","preAuthRef":"PA-77","preAuthPeriod":{"start":"2026-06-03T00:00:00+03:00","end":"2026-07-03T00:00:00+03:00"},"item":[{"itemSequence":1,"extension":[{"url":"x/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"rejected"}]}}],"adjudication":[{"category":{"coding":[{"code":"benefit"}]},"reason":{"coding":[{"code":"CV-1-5"}]},"amount":{"value":0}}]}]}}]}'
          union all
          select toUInt8(1), toInt64(9002), toNullable(toInt64(4)), cast(null as Nullable(Int64)), 'claim-response',
                 toNullable('APPROVED'), toNullable('SUCCEEDED'), toNullable(toDateTime('2026-06-04 10:00:00', 'Asia/Riyadh')),
                 '{"entry":[{"resource":{"resourceType":"ClaimResponse","request":{"identifier":{"value":"7009"}},"item":[{"itemSequence":1,"extension":[{"url":"x/extension-adjudication-outcome","valueCodeableConcept":{"coding":[{"code":"approved"}]}}],"adjudication":[{"category":{"coding":[{"code":"submitted"}]},"amount":{"value":10}},{"category":{"coding":[{"code":"eligible"}]},"amount":{"value":10}},{"category":{"coding":[{"code":"benefit"}]},"amount":{"value":8}}]}]}}]}'
          union all
          select toUInt8(1), toInt64(9201), toNullable(toInt64(3)), toNullable(toInt64(7001)), 'payment-reconciliation',
                 toNullable('COMPLETE'), toNullable('SUCCEEDED'), toNullable(toDateTime('2026-06-20 09:00:00', 'Asia/Riyadh')),
                 '{"entry":[{"resource":{"resourceType":"PaymentReconciliation","detail":[]}}]}'
    expect:
      rows:
        - {response_id: 9001, item_sequence: 1, response_kind: Claim, about_api_trans_id: 7001, outcome: Partially approved, submitted: 100, eligible: 80, benefit: 64, copay: 16, approved_qty: 2, reason_codes: ['BE-1-7', 'MN-1-1'], primary_reason_code: BE-1-7, legacy_reason_amount: 64, preauth_reference: null, preauth_valid_from: null, preauth_valid_to: null}
        - {response_id: 9001, item_sequence: 2, response_kind: Claim, about_api_trans_id: 7001, outcome: Approved, submitted: 30, eligible: 30, benefit: 24, copay: 6, approved_qty: null, reason_codes: [], primary_reason_code: null, legacy_reason_amount: null, preauth_reference: null, preauth_valid_from: null, preauth_valid_to: null}
        - {response_id: 9101, item_sequence: 1, response_kind: Pre-authorisation, about_api_trans_id: 8001, outcome: Rejected, submitted: null, eligible: null, benefit: 0, copay: null, approved_qty: null, reason_codes: ['CV-1-5'], primary_reason_code: CV-1-5, legacy_reason_amount: 0, preauth_reference: PA-77, preauth_valid_from: 2026-06-03, preauth_valid_to: 2026-07-03}
        - {response_id: 9002, item_sequence: 1, response_kind: Claim, about_api_trans_id: 7009, outcome: Approved, submitted: 10, eligible: 10, benefit: 8, copay: null, approved_qty: null, reason_codes: [], primary_reason_code: null, legacy_reason_amount: null, preauth_reference: null, preauth_valid_from: null, preauth_valid_to: null}

  - name: int_claim_payment_parses_reconciliation_details
    description: >
      Reconciliation urn:uuid:A (payment with an early-payment fee, and an advance) was pulled twice: response 9210
      earlier, response 9202 later (lower response_id, changed amount); only the later pull is kept. Reconciliation
      R-B has no fullUrl, so its resource id identifies it. A claim response is ignored. Payer dates may be ISO
      datetimes with an offset.
    model: int_claim_payment
    given:
      - input: ref('stg_oasis__pull_responses')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(9210) as response_id, 'payment-reconciliation' as response_type, toNullable(toDateTime('2026-06-19 09:00:00', 'Asia/Riyadh')) as responded_at, '{"entry":[{"fullUrl":"urn:uuid:A","resource":{"resourceType":"PaymentReconciliation","paymentDate":"2026-06-18T00:00:00+03:00","paymentAmount":{"value":55.0},"paymentIdentifier":{"value":"C1120-1"},"period":{"start":"2026-03-01T00:00:00+03:00","end":"2026-03-24"},"detail":[{"identifier":{"value":"D-1"},"type":{"coding":[{"code":"payment"}]},"request":{"identifier":{"value":"7001"}},"response":{"identifier":{"value":"CR-9"}},"date":"2026-06-18T00:00:00+03:00","amount":{"value":11.4},"extension":[{"url":"x/extension-component-payment","valueMoney":{"value":13.41}},{"url":"x/extension-component-early-fee","valueMoney":{"value":-2.01}},{"url":"x/extension-component-nphies-fee","valueMoney":{"value":0}}]},{"identifier":{"value":"D-2"},"type":{"coding":[{"code":"advance"}]},"request":{"identifier":{"value":"7002"}},"amount":{"value":43.6}}]}}]}' as response_bundle
          union all
          select toUInt8(1) as branch_id, toInt64(9202) as response_id, 'payment-reconciliation' as response_type, toNullable(toDateTime('2026-06-20 09:00:00', 'Asia/Riyadh')) as responded_at, '{"entry":[{"fullUrl":"urn:uuid:A","resource":{"resourceType":"PaymentReconciliation","paymentDate":"2026-06-18T00:00:00+03:00","paymentAmount":{"value":56.1},"paymentIdentifier":{"value":"C1120-1"},"period":{"start":"2026-03-01T00:00:00+03:00","end":"2026-03-24"},"detail":[{"identifier":{"value":"D-1"},"type":{"coding":[{"code":"payment"}]},"request":{"identifier":{"value":"7001"}},"response":{"identifier":{"value":"CR-9"}},"date":"2026-06-18T00:00:00+03:00","amount":{"value":12.5},"extension":[{"url":"x/extension-component-payment","valueMoney":{"value":13.41}},{"url":"x/extension-component-early-fee","valueMoney":{"value":-2.01}},{"url":"x/extension-component-nphies-fee","valueMoney":{"value":0}}]},{"identifier":{"value":"D-2"},"type":{"coding":[{"code":"advance"}]},"request":{"identifier":{"value":"7002"}},"amount":{"value":43.6}}]}}]}' as response_bundle
          union all
          select toUInt8(1) as branch_id, toInt64(9301) as response_id, 'payment-reconciliation' as response_type, toNullable(toDateTime('2026-06-19 12:00:00', 'Asia/Riyadh')) as responded_at, '{"entry":[{"resource":{"resourceType":"PaymentReconciliation","id":"R-B","paymentDate":"2026-06-19","paymentAmount":{"value":20},"paymentIdentifier":{"value":"C2000-1"},"detail":[{"identifier":{"value":"B-1"},"type":{"coding":[{"code":"payment"}]},"request":{"identifier":{"value":"7003"}},"amount":{"value":20}}]}}]}' as response_bundle
          union all
          select toUInt8(1), toInt64(9001), 'claim-response', toNullable(toDateTime('2026-06-20 09:00:00', 'Asia/Riyadh')), '{"entry":[{"resource":{"resourceType":"ClaimResponse","item":[]}}]}'
    expect:
      rows:
        - {response_id: 9202, reconciliation_id: 'urn:uuid:A', detail_index: 1, detail_identifier: D-1, claim_api_trans_id: 7001, payer_claim_response_id: CR-9, detail_type: payment, detail_date: '2026-06-18', amount: 12.5, payment_component: 13.41, early_fee: -2.01, nphies_fee: 0, payment_date: '2026-06-18', payment_amount_total: 56.1, period_start: '2026-03-01', period_end: '2026-03-24', payment_reference: C1120-1}
        - {response_id: 9202, reconciliation_id: 'urn:uuid:A', detail_index: 2, detail_identifier: D-2, claim_api_trans_id: 7002, payer_claim_response_id: null, detail_type: advance, detail_date: null, amount: 43.6, payment_component: 0, early_fee: 0, nphies_fee: 0, payment_date: '2026-06-18', payment_amount_total: 56.1, period_start: '2026-03-01', period_end: '2026-03-24', payment_reference: C1120-1}
        - {response_id: 9301, reconciliation_id: 'R-B', detail_index: 1, detail_identifier: B-1, claim_api_trans_id: 7003, payer_claim_response_id: null, detail_type: payment, detail_date: null, amount: 20, payment_component: 0, early_fee: 0, nphies_fee: 0, payment_date: '2026-06-19', payment_amount_total: 20, period_start: null, period_end: null, payment_reference: C2000-1}

  - name: int_claim_submission_numbers_and_picks_final_response
    description: >
      Invoice 500 is submitted twice (visits 1 then 2). Visit 2's transaction 7002 got PARTIAL and later
      ERROR: the final response is the PARTIAL one. Visit 3 (invoice 600) was sent but has no response.
      Visit 4 was never sent. Visit 5's response has no about_api_trans_id, so it is matched through the
      ClaimResponse request identifier in the bundle.
    model: int_claim_submission
    given:
      - input: ref('stg_oasis__claim_visits')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id,
                 toNullable(toDateTime(rq, 'Asia/Riyadh')) as request_at,
                 toNullable(toDateTime('2026-06-30 00:00:00', 'Asia/Riyadh')) as statement_end_at,
                 if(inv = 0, cast(null as Nullable(Int64)), toNullable(toInt64(inv))) as claim_invoice_no,
                 toNullable('S1') as stat_invoice_no, toNullable(toInt64(100)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toInt64(300)) as purchaser_code, toNullable('O') as claim_type,
                 if(t = 0, cast(null as Nullable(Int64)), toNullable(toInt64(t))) as api_trans_id, toUInt8(0) as is_cancelled
          from values('v UInt32, rq String, inv UInt32, t UInt32',
              (1, '2026-06-01 09:00:00', 500, 7001), (2, '2026-06-10 09:00:00', 500, 7002),
              (3, '2026-06-05 09:00:00', 600, 7003), (4, '2026-06-06 09:00:00', 700, 0),
              (5, '2026-06-07 09:00:00', 800, 7005))
      - input: ref('stg_oasis__pull_responses')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(r) as response_id,
                 if(t = 0, cast(null as Nullable(Int64)), toNullable(toInt64(t))) as about_api_trans_id,
                 'claim-response' as response_type, toNullable(st) as res_status,
                 toNullable(toDateTime(at, 'Asia/Riyadh')) as responded_at, bundle as response_bundle
          from values('r UInt32, t UInt32, st String, at String, bundle String',
              (9001, 7001, 'REJECTED', '2026-06-03 10:00:00', '{}'),
              (9002, 7002, 'PARTIAL',  '2026-06-12 10:00:00', '{}'),
              (9003, 7002, 'ERROR',    '2026-06-13 10:00:00', '{}'),
              (9004, 0,    'APPROVED', '2026-06-09 10:00:00',
               '{"entry":[{"resource":{"resourceType":"ClaimResponse","request":{"identifier":{"value":"7005"}}}}]}'))
    expect:
      rows:
        - {visit_id: 1, submission_number: 1, submission_count: 2, is_latest_submission: 0, is_sent: 1, final_response_id: 9001, final_status: REJECTED, response_count: 1, adjudication_status: Adjudicated}
        - {visit_id: 2, submission_number: 2, submission_count: 2, is_latest_submission: 1, is_sent: 1, final_response_id: 9002, final_status: PARTIAL, response_count: 2, adjudication_status: Adjudicated}
        - {visit_id: 3, submission_number: 1, submission_count: 1, is_latest_submission: 1, is_sent: 1, final_response_id: null, final_status: null, response_count: 0, adjudication_status: No response}
        - {visit_id: 4, submission_number: 1, submission_count: 1, is_latest_submission: 1, is_sent: 0, final_response_id: null, final_status: null, response_count: 0, adjudication_status: Not sent}
        - {visit_id: 5, submission_number: 1, submission_count: 1, is_latest_submission: 1, is_sent: 1, final_response_id: 9004, final_status: APPROVED, response_count: 1, adjudication_status: Adjudicated}
