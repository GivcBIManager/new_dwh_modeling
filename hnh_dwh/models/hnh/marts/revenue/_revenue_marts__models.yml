version: 2

models:
  - name: fact_charge_line
    description: One live, cancelled or unknown-status Oasis charge row. Superseded (R) rows are excluded. Rebuilt in full every night.
    columns:
      - name: charge_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: delivery_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: department_key
        tests:
          - relationships: {to: ref('hnh_dim_department'), field: department_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: product_category_key
        tests:
          - relationships: {to: ref('dim_product_category'), field: product_category_key}
      - name: billed_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: episode_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: charge_status
        tests:
          - accepted_values:
              values: ['Live', 'Cancelled', 'Unknown']
      - name: bill_to
        tests:
          - accepted_values:
              values: ['1', '2', '3']
              config: {severity: warn}
  - name: fact_revenue_adjustment
    description: >
      Post-invoice discounts (CREDITAR documents numbered <charge invoice>D), dated on the credit date.
      Keys are -1 when the base invoice has no live charge line in the window.
    columns:
      - name: adjustment_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: adjustment_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: billed_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
  - name: fact_cash_receipt
    description: >
      Oasis patient receipts: account CASHACC, none, or the patient's own account. Insurer and contract
      receipts are excluded (Phase 3).
      Receipts are net of reversals; is_reversal marks receipt documents with a negative amount.
    columns:
      - name: receipt_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: receipt_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: receipt_type
        tests:
          - accepted_values:
              values: ['Cashier', 'AR cash receipt', 'Receipt (REC)', 'Other']
  - name: fact_invoice
    description: One Oasis episode invoice with its statement. net_amount is what the payer is billed.
    columns:
      - name: invoice_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: invoice_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: submission_status
        tests:
          - accepted_values:
              values: ['New', 'Submitted', 'Cancelled', 'Error In Response', 'Failed To Submit', 'Invalid', 'Queued In Nphies', 'Under Processing']
  - name: agg_episode_billing
    description: Claimable charges against invoiced net per episode. Replaces the claims model's Not Billed.
    tests:
      - hnh_unique_combination:
          columns: [branch_key, episode_key]
  - name: fact_preauth_line
    description: One pre-authorisation line with its final NPHIES answer, turnaround and delivery.
    columns:
      - name: preauth_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: request_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: requesting_staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: preauth_outcome_key
        tests:
          - relationships: {to: ref('dim_preauth_outcome'), field: preauth_outcome_key}
  - name: fact_claim_line
    description: One NPHIES claim service line per submission, with the final adjudication of that submission. Default KPIs use is_latest_submission = 1.
    columns:
      - name: claim_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: statement_end_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: nphies_reason_key
        tests:
          - relationships: {to: ref('dim_nphies_reason'), field: nphies_reason_key}
      - name: invoice_key
        tests:
          - relationships:
              to: ref('fact_invoice')
              field: invoice_key
              config: {severity: warn}
      - name: adjudication_status
        tests:
          - accepted_values:
              values: ['Not sent', 'No response', 'Adjudicated', 'Pended', 'Error']
      - name: reason_source
        tests:
          - accepted_values:
              values: ['NPHIES response', 'Claim notes', 'Not given']
      - name: item_outcome
        tests:
          - accepted_values:
              values: ['Approved', 'Partially approved', 'Not required', 'Rejected', 'Pended', 'Unknown', 'Not adjudicated']
