version: 2

models:
  - name: fact_charge_line
    description: One live, cancelled or unknown-status Oasis charge row. Superseded (R) rows are excluded. Rebuilt in full every night.
    columns:
      - name: charge_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: delivery_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: department_key
        tests:
          - relationships: {to: ref('hnh_dim_department'), field: department_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: product_category_key
        tests:
          - relationships: {to: ref('dim_product_category'), field: product_category_key}
      - name: billed_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: episode_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: charge_status
        tests:
          - accepted_values:
              values: ['Live', 'Cancelled', 'Unknown']
      - name: bill_to
        tests:
          - accepted_values:
              values: ['1', '2', '3']
              config: {severity: warn}
  - name: fact_revenue_adjustment
    description: >
      Post-invoice discounts (CREDITAR documents numbered <charge invoice>D), dated on the credit date.
      Keys are -1 when the base invoice has no live charge line in the window.
    columns:
      - name: adjustment_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: adjustment_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: billed_payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
  - name: fact_cash_receipt
    description: >
      Oasis patient receipts: account CASHACC, none, or the patient's own account. Insurer and contract
      receipts are excluded (Phase 3).
      Receipts are net of cancellations and refunds. receipt_kind: Receipt (money in), Cancellation (a negative
      receipt matching an earlier receipt of the same patient, episode and amount), Refund (any other negative
      receipt, money paid back). Cash collected = Σ receipt_amount over Receipt and Cancellation; refunds = Σ over Refund.
    columns:
      - name: receipt_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: receipt_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: receipt_type
        tests:
          - accepted_values:
              values: ['Cashier', 'AR cash receipt', 'Receipt (REC)', 'Other']
  - name: fact_invoice
    description: One Oasis episode invoice with its statement. net_amount is what the payer is billed.
    columns:
      - name: invoice_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: invoice_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: submission_status
        tests:
          - accepted_values:
              values: ['New', 'Submitted', 'Cancelled', 'Error In Response', 'Failed To Submit', 'Invalid', 'Queued In Nphies', 'Under Processing']
  - name: agg_episode_billing
    description: Claimable charges against invoiced net per episode. Replaces the claims model's Not Billed.
    tests:
      - hnh_unique_combination:
          columns: [branch_key, episode_key]
  - name: fact_preauth_line
    description: >
      One pre-authorisation line with its final NPHIES answer, turnaround and delivery. Rows with line_source
      'Payer advance' are payer-initiated advance authorisations (spec Phase 2B section 12): no request, send,
      service, delivery or turnaround; care type from the payer's subType; filter them out of the hospital
      pre-authorisation measures and count them on their own (payer_approved_amount, advance_reason, payer_license,
      referring_provider_name, episode_link_method, episode_match_count, pull_count are their attributes).
    columns:
      - name: preauth_line_key
        tests: [unique, not_null]
      - name: line_source
        tests:
          - accepted_values:
              values: ['Oasis', 'NPHIES only', 'Payer advance']
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: request_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: requesting_staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: preauth_outcome_key
        tests:
          - relationships: {to: ref('dim_preauth_outcome'), field: preauth_outcome_key}
      - name: nphies_reason_key
        tests:
          - relationships: {to: ref('dim_nphies_reason'), field: nphies_reason_key}
  - name: fact_claim_line
    description: One NPHIES claim service line per submission, with the final adjudication of that submission. Default KPIs use is_latest_submission = 1.
    columns:
      - name: claim_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: statement_end_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
      - name: service_key
        tests:
          - relationships: {to: ref('dim_service'), field: service_key}
      - name: care_type_key
        tests:
          - relationships: {to: ref('dim_care_type'), field: care_type_key}
      - name: nphies_reason_key
        tests:
          - relationships: {to: ref('dim_nphies_reason'), field: nphies_reason_key}
      - name: invoice_key
        description: >
          Key of the fact_invoice row with the same branch and invoice number as claim_invoice_no, -1 when none.
          Claim invoice numbers are partly a different number space from the AR invoices (about 25K claim invoices
          are absent from AR and about 22K match only another branch's numbers), so the warn test below reports
          those lines; it does not mean the invoice is outside the invoice window. Use for drill-through or SQL only.
        tests:
          - relationships:
              to: ref('fact_invoice')
              field: invoice_key
              config: {severity: warn}
      - name: adjudication_status
        tests:
          - accepted_values:
              values: ['Not sent', 'No response', 'Adjudicated', 'Pended', 'Error']
      - name: reason_source
        tests:
          - accepted_values:
              values: ['NPHIES response', 'Claim notes', 'Not given']
      - name: item_outcome
        tests:
          - accepted_values:
              values: ['Approved', 'Partially approved', 'Not required', 'Rejected', 'Pended', 'Unknown', 'Not adjudicated']

  - name: fact_claim_payment
    description: One NPHIES remittance line (claim level). Non-NPHIES payers and AR ageing are Phase 3.
    columns:
      - name: claim_payment_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: payment_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: patient_key
        tests:
          - relationships: {to: ref('dim_patient'), field: patient_key}
      - name: payer_key
        tests:
          - relationships: {to: ref('dim_payer'), field: payer_key}
