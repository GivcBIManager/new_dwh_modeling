      - input: ref('dim_policy')
        format: sql
        rows: |
          select toInt64(-1) as policy_key
      - input: ref('dim_service_department')
        format: sql
        rows: |
          select toInt64(-1) as service_department_key
      - input: ref('fact_encounter')
        format: sql
        rows: |
          select toInt64(-1) as encounter_key, toInt32(20260101) as encounter_date_key, 'OP' as encounter_type,
