  - name: fact_charge_line_links_staff_roles
    description: >
      Staff roles from int_charge_line_links. Charge 1: ordering doctor D1, MRP 1 D2, MRP 2 D3 and charged by C1 are in
      dim_staff and get their keys; MRP 3 X9 is missing from dim_staff and gets -1. Charge 2: ordering doctor X9 (missing)
      gets -1, no MRP gives -1, and charged by D1 gets D1's key (the same doctor in another role). Charge 3 has no link
      row: every role key is -1. Keys are hnh_surrogate_key of (branch, staff id): D1 1198877926936873208,
      D2 4985490886828511394, D3 6392781986039274833, C1 8503321368048916038.
    model: fact_charge_line
    given:
      - input: ref('stg_oasis__charges')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as delivery_charge_id, toNullable(toInt64(id * 10)) as delivery_line,
                 toNullable(toDateTime('2026-06-01 10:00:00', 'Asia/Riyadh')) as delivered_at,
                 toNullable(toInt64(100)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 cast(null as Nullable(Int64)) as admission_no, cast(null as Nullable(Int64)) as encounter_id,
                 cast(null as Nullable(String)) as encounter_type, cast(null as Nullable(String)) as staff_id,
                 toNullable(toInt64(500)) as ios, toNullable(toInt64(300)) as purchaser_code,
                 cast(null as Nullable(Int64)) as package_id, toNullable(toInt64(77)) as doc_id,
                 toNullable('CRD1') as invoice_doc_no, cast(null as Nullable(String)) as cancel_flag,
                 cast(null as Nullable(Int64)) as cancel_reason_code, toNullable('1') as bill_to,
                 cast(null as Nullable(String)) as package_deal_flag,
                 toNullable('O') as attendance_type, toNullable('LAB') as product_category_code,
                 toFloat64(1) as units_delivered, toFloat64(10) as price_paid_purchaser,
                 toFloat64(0) as discount_given, toFloat64(0) as vat_value,
                 toDateTime64('2026-06-02 00:00:00', 6, 'UTC') as updated_at
          from values('id UInt32', 1, 2, 3)
      - input: ref('stg_oasis__delivery_lines')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(-1) as delivery_line, toNullable(toInt64(-1)) as master_delivery_no
      - input: ref('stg_oasis__master_deliveries')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(-1) as master_delivery_no, cast(null as Nullable(Int64)) as work_entity
      - input: ref('int_episode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(1) as episode_no,
                 'OP' as care_type, toInt64(300) as purchaser_code
      - input: ref('int_encounter')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, 'OP' as encounter_type, toInt64(-1) as source_id, toNullable(toInt64(-1)) as patient_id
      - input: ref('int_admission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(-1) as admission_no, toUInt8(0) as is_ltc, toUInt8(0) as is_ltc_to_date
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
      - input: ref('dim_staff')
        format: sql
        rows: |
          select toInt64(-1) as staff_key
          union all
          select toInt64(bitShiftRight(cityHash64(concat('1|', s, '|')), 1))
          from values('s String', 'D1', 'D2', 'D3', 'C1')
      - input: ref('hnh_dim_department')
        format: sql
        rows: |
          select toInt64(-1) as department_key, cast(null as Nullable(String)) as entity_type
      - input: ref('dim_service')
        format: sql
        rows: |
          select toInt64(-1) as service_key
      - input: ref('dim_product_category')
        format: sql
        rows: |
          select toInt64(-1) as product_category_key
      - input: ref('dim_payer')
