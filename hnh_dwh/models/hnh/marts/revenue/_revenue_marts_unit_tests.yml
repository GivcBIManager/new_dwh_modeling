version: 2

unit_tests:
  - name: fact_charge_line_applies_billing_rules
    description: >
      Line 10 (outpatient): purchaser row, co-pay on bill-to 3, and a superseded R row that must be dropped.
      Line 20 (inpatient): purchaser row and co-pay on bill-to 2. Line 30: pure cash. Line 40: a package
      component (not revenue). Line 50: a cancelled row. Line 60: a patient row whose purchaser row is
      superseded, so it is pure cash, not a co-pay. Line 70: an unknown cancel flag (I), kept as
      Unknown with no revenue. Line 80: typed E, resolves to ER visit 9002 of the same patient. Line 90:
      typed O, resolves to OP appointment 9001. Encounters: line 10 charges carry appointment 9001 in
      both encounter_id and admission_no and resolve to the OP encounter with no admission; ER visit 9001
      belongs to another patient and must not link. Lines 20 and 40 resolve to admission 7001 (LTC).
      Line 100: inpatient self-pay (bill-to 2, no purchaser row), which is cash.
    model: fact_charge_line
    given:
      - input: ref('stg_oasis__charges')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as delivery_charge_id, toNullable(toInt64(line)) as delivery_line,
                 toNullable(toDateTime('2026-06-01 10:00:00', 'Asia/Riyadh')) as delivered_at,
                 toNullable(toInt64(patient)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 if(adm = 0, cast(null as Nullable(Int64)), toNullable(toInt64(adm))) as admission_no,
                 if(eid = 0, cast(null as Nullable(Int64)), toNullable(toInt64(eid))) as encounter_id,
                 if(et = '', cast(null as Nullable(String)), toNullable(et)) as encounter_type,
                 cast(null as Nullable(String)) as staff_id,
                 toNullable(toInt64(500)) as ios,
                 if(purchaser = 0, cast(null as Nullable(Int64)), toNullable(toInt64(purchaser))) as purchaser_code,
                 cast(null as Nullable(Int64)) as package_id, toNullable(toInt64(77)) as doc_id,
                 toNullable('CRD1') as invoice_doc_no,
                 if(cf = '', cast(null as Nullable(String)), toNullable(cf)) as cancel_flag,
                 cast(null as Nullable(Int64)) as cancel_reason_code,
                 toNullable(bill_to) as bill_to,
                 if(pkg = '', cast(null as Nullable(String)), toNullable(pkg)) as package_deal_flag,
                 toNullable(att) as attendance_type, toNullable('LAB') as product_category_code,
                 toFloat64(1) as units_delivered, toFloat64(price) as price_paid_purchaser,
                 toFloat64(disc) as discount_given, toFloat64(0) as vat_value,
                 toDateTime64('2026-06-02 00:00:00', 6, 'UTC') as updated_at
          from values('id UInt32, line UInt32, patient UInt32, bill_to String, cf String, pkg String, purchaser UInt32, att String, price Float64, disc Float64, eid UInt32, et String, adm UInt32',
              (1, 10, 100, '1', '',  '',  300, 'O', 80,  20, 9001, '', 9001),
              (2, 10, 100, '3', '',  '',  0,   'O', 20,  0,  9001, '', 9001),
              (3, 10, 100, '1', 'R', '',  300, 'O', 80,  20, 9001, '', 9001),
              (4, 20, 200, '1', '',  '',  300, 'I', 500, 0,  7001, '', 7001),
              (5, 20, 200, '2', '',  '',  300, 'I', 50,  0,  7001, '', 7001),
              (6, 30, 100, '3', '',  '',  0,   'O', 40,  0,  0,    '', 0),
              (7, 40, 200, '1', '',  'Y', 300, 'I', 70,  0,  7001, '', 7001),
              (8, 50, 200, '1', 'C', '',  300, 'I', 60,  0,  0,    '', 0),
              (9, 60, 100, '1', 'R', '',  300, 'O', 90,  0,  0,    '', 0),
              (10, 60, 100, '3', '', '',  0,   'O', 15,  0,  0,    '', 0),
              (11, 70, 100, '1', 'I', '', 300, 'O', 5,   0,  0,    '', 0),
              (12, 80, 100, '1', '',  '', 300, 'O', 30,  0,  9002, 'E', 0),
              (13, 90, 100, '1', '',  '', 300, 'O', 10,  0,  9001, 'O', 0),
              (14, 100, 200, '2', '', '', 0,   'I', 25,  0,  0,    '', 0))
      - input: ref('stg_oasis__delivery_lines')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(-1) as delivery_line, toNullable(toInt64(-1)) as master_delivery_no
      - input: ref('stg_oasis__master_deliveries')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(-1) as master_delivery_no, cast(null as Nullable(Int64)) as work_entity
      - input: ref('int_episode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(1) as episode_no,
                 'OP' as care_type, toInt64(300) as purchaser_code
          union all
          select toUInt8(1), toInt64(200), toInt64(1), 'IP', toInt64(300)
      - input: ref('int_encounter')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, 'OP' as encounter_type, toInt64(9001) as source_id, toNullable(toInt64(100)) as patient_id
          union all
          select toUInt8(1), 'IP', toInt64(7001), toNullable(toInt64(200))
          union all
          select toUInt8(1), 'ER', toInt64(9001), toNullable(toInt64(555))
          union all
          select toUInt8(1), 'ER', toInt64(9002), toNullable(toInt64(100))
      - input: ref('int_admission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(7001) as admission_no, toUInt8(1) as is_ltc, toUInt8(0) as is_ltc_to_date
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
      - input: ref('dim_staff')
        format: sql
        rows: |
          select toInt64(-1) as staff_key
      - input: ref('hnh_dim_department')
        format: sql
        rows: |
          select toInt64(-1) as department_key, cast(null as Nullable(String)) as entity_type
      - input: ref('dim_service')
        format: sql
        rows: |
          select toInt64(-1) as service_key
      - input: ref('dim_product_category')
        format: sql
        rows: |
          select toInt64(-1) as product_category_key
      - input: ref('dim_payer')
        format: sql
        rows: |
          select toInt64(-1) as payer_key, 'Unknown' as creditor
    expect:
      rows:
        - {delivery_charge_id: 1,  charge_status: Live,      billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 80,  gross_amount: 100, package_content_amount: 0,  is_claimable: 1, care_type_key: 1, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: OP, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 2,  charge_status: Live,      billed_purchaser_code: 8888, is_patient_share: 1, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 20,  gross_amount: 20,  package_content_amount: 0,  is_claimable: 0, care_type_key: 1, legacy_trans_purchaser: 8888, legacy_patient_purchaser: 300, resolved_encounter_type: OP, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 4,  charge_status: Live,      billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 500, gross_amount: 500, package_content_amount: 0,  is_claimable: 1, care_type_key: 3, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: IP, admission_no: 7001, is_ltc: 1}
        - {delivery_charge_id: 5,  charge_status: Live,      billed_purchaser_code: 8888, is_patient_share: 1, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 50,  gross_amount: 50,  package_content_amount: 0,  is_claimable: 0, care_type_key: 3, legacy_trans_purchaser: 8888, legacy_patient_purchaser: 300, resolved_encounter_type: IP, admission_no: 7001, is_ltc: 1}
        - {delivery_charge_id: 6,  charge_status: Live,      billed_purchaser_code: 9999, is_patient_share: 0, is_cash_billed: 1, is_recognised_revenue: 1, revenue_amount: 40,  gross_amount: 40,  package_content_amount: 0,  is_claimable: 0, care_type_key: 1, legacy_trans_purchaser: 9999, legacy_patient_purchaser: 9999, resolved_encounter_type: null, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 7,  charge_status: Live,      billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 0, revenue_amount: 0,   gross_amount: 70,  package_content_amount: 70, is_claimable: 0, care_type_key: 3, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: IP, admission_no: 7001, is_ltc: 1}
        - {delivery_charge_id: 8,  charge_status: Cancelled, billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 0, revenue_amount: 0,   gross_amount: 60,  package_content_amount: 0,  is_claimable: 0, care_type_key: 3, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: null, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 10, charge_status: Live,      billed_purchaser_code: 9999, is_patient_share: 0, is_cash_billed: 1, is_recognised_revenue: 1, revenue_amount: 15,  gross_amount: 15,  package_content_amount: 0,  is_claimable: 0, care_type_key: 1, legacy_trans_purchaser: 9999, legacy_patient_purchaser: 9999, resolved_encounter_type: null, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 11, charge_status: Unknown,   billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 0, revenue_amount: 0,   gross_amount: 5,   package_content_amount: 0,  is_claimable: 0, care_type_key: 1, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: null, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 12, charge_status: Live,      billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 30,  gross_amount: 30,  package_content_amount: 0,  is_claimable: 1, care_type_key: 1, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: ER, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 13, charge_status: Live,      billed_purchaser_code: 300,  is_patient_share: 0, is_cash_billed: 0, is_recognised_revenue: 1, revenue_amount: 10,  gross_amount: 10,  package_content_amount: 0,  is_claimable: 1, care_type_key: 1, legacy_trans_purchaser: 300,  legacy_patient_purchaser: 300, resolved_encounter_type: OP, admission_no: null, is_ltc: 0}
        - {delivery_charge_id: 14, charge_status: Live,      billed_purchaser_code: 9999, is_patient_share: 0, is_cash_billed: 1, is_recognised_revenue: 1, revenue_amount: 25,  gross_amount: 25,  package_content_amount: 0,  is_claimable: 0, care_type_key: 3, legacy_trans_purchaser: 9999, legacy_patient_purchaser: 9999, resolved_encounter_type: null, admission_no: null, is_ltc: 0}

  - name: fact_revenue_adjustment_matches_discount_documents
    description: >
      CRD100D is a post-invoice discount on charge invoice CRD100. MD55D is a depreciation document and
      CRD999D has no charge invoice; neither is an adjustment. The keys come from the most frequent
      combination on the base invoice (episode 11, two lines) rather than episode 12 (one line). CRD200 ties
      on line count between episodes 40 and 41 and resolves to the lowest episode key.
    model: fact_revenue_adjustment
    given:
      - input: ref('stg_oasis__ar_documents')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as doc_id, toNullable(no) as doc_no, toNullable(t) as doc_type,
                 toNullable(toDateTime('2026-06-20 12:00:00', 'Asia/Riyadh')) as doc_at, toFloat64(amt) as total_doc_price
          from values('id UInt32, no String, t String, amt Float64',
              (1, 'CRD100', 'INVOICEAR', 250), (2, 'CRD100D', 'CREDITAR', -30),
              (3, 'MD55D', 'SYSDPRC', 500), (4, 'CRD999D', 'CREDITAR', -10),
              (5, 'CRD200D', 'CREDITAR', -20), (6, 'CRD200', 'INVOICEAR', 60))
      - input: ref('fact_charge_line')
        format: sql
        rows: |
          select toUInt8(1) as branch_key, toNullable(inv) as invoice_doc_no, toInt64(ep) as episode_key,
                 toInt64(21) as patient_key, toInt64(31) as billed_payer_key, toInt8(1) as care_type_key,
                 'Live' as charge_status, toFloat64(net) as net_amount
          from values('inv String, ep Int64, net Float64',
              ('CRD100', 11, 100), ('CRD100', 11, 100), ('CRD100', 12, 50), ('CRD200', 41, 30), ('CRD200', 40, 30))
    expect:
      rows:
        - {doc_id: 2, base_doc_no: CRD100, adjustment_amount: -30, base_invoice_net_amount: 250, episode_key: 11, patient_key: 21, billed_payer_key: 31, care_type_key: 1}
        - {doc_id: 5, base_doc_no: CRD200, adjustment_amount: -20, base_invoice_net_amount: 60, episode_key: 40, patient_key: 21, billed_payer_key: 31, care_type_key: 1}

  - name: fact_preauth_line_counts_delivery_after_request_only
    description: >
      A1 (service 500) was approved; its only charge was on 5 June, before the 10 June request, so it is
      approved and not delivered. A2 (service 600) was rejected but delivered on 12 June. V7001-R1 is a payer
      advance authorisation (no service, request or send, IP from the payer's subType): approved, never counted as
      delivered or approved-not-delivered, with no estimated approved amount or turnaround although the episode is OP.
    model: fact_preauth_line
    given:
      - input: ref('int_preauth_line')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, line as line_natural_id, src as line_source, toNullable(toInt64(100)) as patient_id,
                 toNullable(toInt64(1)) as episode_no, if(ios = 0, cast(null as Nullable(Int64)), toNullable(toInt64(ios))) as ios,
                 cast(null as Nullable(String)) as requesting_staff_id, toNullable(toInt64(300)) as purchaser_code,
                 toNullable(toDateTime('2026-06-10 09:00:00', 'Asia/Riyadh')) as requested_at,
                 if(src = 'Payer advance', cast(null as Nullable(DateTime('Asia/Riyadh'))),
                    toNullable(toDateTime('2026-06-10 09:10:00', 'Asia/Riyadh'))) as first_sent_at,
                 toNullable(toDateTime('2026-06-10 09:40:00', 'Asia/Riyadh')) as final_responded_at,
                 toNullable(toDateTime('2026-06-10 09:40:00', 'Asia/Riyadh')) as last_responded_at,
                 outcome as preauth_outcome, toNullable(st) as nphies_final_status, toNullable(st) as nphies_first_status,
                 if(flag = '', cast(null as Nullable(String)), toNullable(flag)) as authorised_flag,
                 toUInt64(if(src = 'Payer advance', 0, 1)) as request_send_count,
                 if(src = 'Payer advance', cast(null as Nullable(Float64)), toNullable(toFloat64(2))) as requested_qty,
                 if(src = 'Payer advance', cast(null as Nullable(Float64)), toNullable(toFloat64(2))) as approved_qty,
                 toNullable(toFloat64(200)) as estimated_amount,
                 cast(null as Nullable(String)) as primary_reason_code, cast(null as Nullable(Date)) as preauth_valid_from,
                 cast(null as Nullable(Date)) as preauth_valid_to,
                 if(src = 'Payer advance', toNullable('IP'), cast(null as Nullable(String))) as advance_care_type
          from values('line String, src String, ios UInt32, outcome String, st String, flag String',
              ('A1', 'Oasis', 500, 'Approved', 'APPROVED', 'Y'), ('A2', 'Oasis', 600, 'Rejected', 'REJECTED', 'R'),
              ('V7001-R1', 'Payer advance', 0, 'Approved', 'APPROVED', ''))
      - input: ref('int_episode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(1) as episode_no,
                 'OP' as care_type, toInt64(300) as purchaser_code
      - input: ref('fact_charge_line')
        format: sql
        rows: |
          select toUInt8(1) as branch_key, toInt64(bitShiftRight(cityHash64('1|100|1|'), 1)) as episode_key,
                 toInt64(bitShiftRight(cityHash64(svc), 1)) as service_key, toInt32(d) as delivery_date_key,
                 'Live' as charge_status
          from values('svc String, d UInt32', ('1|500|', 20260605), ('1|600|', 20260612))
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
      - input: ref('dim_staff')
        format: sql
        rows: |
          select toInt64(-1) as staff_key
      - input: ref('dim_service')
        format: sql
        rows: |
          select toInt64(-1) as service_key
      - input: ref('dim_payer')
        format: sql
        rows: |
          select toInt64(-1) as payer_key
      - input: ref('dim_nphies_reason')
        format: sql
        rows: |
          select toInt64(-1) as nphies_reason_key
    expect:
      rows:
        - {line_natural_id: A1, is_delivered: 0, is_approved_not_delivered: 1, is_delivered_not_approved: 0, approved_estimated_amount: 200, is_approved: 1, has_final_response: 1, care_type_key: 1, nphies_reason_key: 0, total_turnaround_minutes: 40}
        - {line_natural_id: A2, is_delivered: 1, is_approved_not_delivered: 0, is_delivered_not_approved: 1, approved_estimated_amount: 200, is_approved: 0, has_final_response: 1, care_type_key: 1, nphies_reason_key: 0, total_turnaround_minutes: 40}
        - {line_natural_id: V7001-R1, is_delivered: 0, is_approved_not_delivered: 0, is_delivered_not_approved: 0, approved_estimated_amount: null, is_approved: 1, has_final_response: 1, care_type_key: 3, nphies_reason_key: 0, total_turnaround_minutes: null}

  - name: fact_cash_receipt_keeps_patient_receipts_only
    description: >
      Patient receipts are on account CASHACC, have no account, or are on the patient's own account (doc 6,
      account 102 for patient 102; doc 7, a REC receipt on patient 103's account). The INS and DIR receipts are insurer and contract collections (Phase 3)
      and are left out. Doc 5 (a positive CSH document, -20) cancels doc 8's receipt of 20 for the same patient and
      episode; doc 9 (-15) matches no receipt, so it is a refund.
    model: fact_cash_receipt
    given:
      - input: ref('stg_oasis__ar_documents')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(id) as doc_id, toNullable(no) as doc_no,
                 toNullable('RECEIPT') as doc_type,
                 toNullable(toDateTime('2026-06-20 12:00:00', 'Asia/Riyadh')) as doc_at,
                 if(acc = '', cast(null as Nullable(String)), toNullable(acc)) as account_code,
                 if(ref = '', cast(null as Nullable(String)), toNullable(ref)) as ext_ref,
                 toNullable('1') as ext_acc_doc_no, toFloat64(amt) as total_doc_price
          from values('id UInt32, no String, acc String, ref String, amt Float64',
              (1, 'CSH0000001', 'CASHACC', '100', -50),
              (2, 'RCT0000001', '', '101', -40),
              (3, 'RCT0000002', 'INS-1001-0001', '', -1000),
              (4, 'REC0000001', 'DIR-0006-004', '', -2000),
              (5, 'CSH0000002', 'CASHACC', '100', 20),
              (6, 'RCT0000003', '102', '102', -30),
              (7, 'REC0000002', '103', '103', -10),
              (8, 'CSH0000003', 'CASHACC', '100', -20),
              (9, 'CSH0000004', 'CASHACC', '100', 15))
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
    expect:
      rows:
        - {doc_id: 1, receipt_type: Cashier,         receipt_amount: 50,  receipt_kind: Receipt}
        - {doc_id: 2, receipt_type: AR cash receipt, receipt_amount: 40,  receipt_kind: Receipt}
        - {doc_id: 5, receipt_type: Cashier,         receipt_amount: -20, receipt_kind: Cancellation}
        - {doc_id: 6, receipt_type: AR cash receipt, receipt_amount: 30,  receipt_kind: Receipt}
        - {doc_id: 7, receipt_type: Receipt (REC),   receipt_amount: 10,  receipt_kind: Receipt}
        - {doc_id: 8, receipt_type: Cashier,         receipt_amount: 20,  receipt_kind: Receipt}
        - {doc_id: 9, receipt_type: Cashier,         receipt_amount: -15, receipt_kind: Refund}
