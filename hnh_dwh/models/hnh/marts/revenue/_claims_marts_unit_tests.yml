version: 2

unit_tests:
  - name: fact_claim_line_applies_adjudication_rules
    description: >
      Invoice 500: visit 1 (submission 1) was rejected with BE-1-3; visit 2 (latest) was partially approved
      without a reason. Visit 3 was sent but not answered. Visit 4: line 1 approved with a 20% co-pay
      (rejected 0, legacy rejected 0: the old logic counted the full net amount as approved); line 2 rejected
      with no reason in the response but MN-1-1 in the notes. Visit 5: approved item without an eligible amount
      (rejected 0). Visit 6: rejected item with eligible = submitted (rejected = submitted). Visit 7: marked
      Adjudicated but its response has no matching item, so the line keeps its own outcome and no amounts.
      Visit 8: PARTIAL line whose response carries a reason-bearing adjudication (legacy approved = its
      benefit). Visit 9: partially approved item without a submitted amount (claimed amount is used).
      Visit 10: Error status, so the reason code on its response item is ignored.
    model: fact_claim_line
    given:
      - input: ref('stg_oasis__claim_services')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id, toInt64(sq) as sequence_no, toNullable(toInt64(500)) as ios,
                 toNullable('S-1') as service_code, toFloat64(net) as net_amount,
                 if(oc = '', cast(null as Nullable(String)), toNullable(oc)) as outcome,
                 if(nt = '', cast(null as Nullable(String)), toNullable(nt)) as notes
          from values('v UInt32, sq UInt32, net Float64, oc String, nt String',
              (1, 1, 100, 'REJECTED', ''), (2, 1, 100, 'PARTIAL', ''), (3, 1, 50, '', ''),
              (4, 1, 30, 'APPROVED', ''), (4, 2, 40, 'REJECTED', '- MN-1-1 not justified'),
              (5, 1, 50, 'APPROVED', ''), (6, 1, 60, 'REJECTED', ''), (7, 1, 70, 'APPROVED', ''), (7, 2, 20, '', ''),
              (8, 1, 100, 'PARTIAL', ''), (9, 1, 90, 'PARTIAL', ''), (10, 1, 40, 'REJECTED', ''))
      - input: ref('int_claim_submission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id, toNullable(toInt64(inv)) as claim_invoice_no,
                 toNullable('S1') as stat_invoice_no, toNullable(toInt64(100)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toInt64(300)) as purchaser_code, toNullable('O') as claim_type,
                 toNullable(toDateTime('2026-06-01 09:00:00', 'Asia/Riyadh')) as request_at,
                 toNullable(toDateTime('2026-06-30 00:00:00', 'Asia/Riyadh')) as statement_end_at, toUInt8(0) as is_cancelled,
                 toUInt64(sn) as submission_number, toUInt8(lt) as is_latest_submission, toUInt8(1) as is_sent,
                 if(fr = 0, cast(null as Nullable(Int64)), toNullable(toInt64(fr))) as final_response_id,
                 toNullable(toDateTime('2026-06-05 09:00:00', 'Asia/Riyadh')) as final_responded_at,
                 st as adjudication_status
          from values('v UInt32, inv UInt32, sn UInt32, lt UInt8, fr UInt32, st String',
              (1, 500, 1, 0, 9001, 'Adjudicated'), (2, 500, 2, 1, 9002, 'Adjudicated'),
              (3, 600, 1, 1, 0, 'No response'), (4, 700, 1, 1, 9004, 'Adjudicated'),
              (5, 800, 1, 1, 9005, 'Adjudicated'), (6, 810, 1, 1, 9006, 'Adjudicated'),
              (7, 820, 1, 1, 9007, 'Adjudicated'), (8, 830, 1, 1, 9008, 'Adjudicated'),
              (9, 840, 1, 1, 9009, 'Adjudicated'), (10, 850, 1, 1, 9010, 'Error'))
      - input: ref('int_nphies_adjudication')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(r) as response_id, toInt64(sq) as item_sequence, 'Claim' as response_kind,
                 oc as outcome, if(sub < 0, cast(null as Nullable(Float64)), toNullable(sub)) as submitted,
                 if(elg < 0, cast(null as Nullable(Float64)), toNullable(elg)) as eligible,
                 toNullable(toFloat64(ben)) as benefit, toNullable(toFloat64(cp)) as copay,
                 cast(null as Nullable(Float64)) as deductible, cast(null as Nullable(Float64)) as tax,
                 toNullable(toFloat64(cp)) as patient_share, cast(null as Nullable(Float64)) as approved_qty,
                 if(rc = '', cast([] as Array(String)), [rc]) as reason_codes,
                 if(rc = '', cast(null as Nullable(String)), toNullable(rc)) as primary_reason_code,
                 if(rc = '', cast(null as Nullable(Float64)), toNullable(toFloat64(ben))) as legacy_reason_amount
          from values('r UInt32, sq UInt32, oc String, sub Float64, elg Float64, ben Float64, cp Float64, rc String',
              (9001, 1, 'Rejected', 100, 0, 0, 0, 'BE-1-3'),
              (9002, 1, 'Partially approved', 100, 80, 64, 16, ''),
              (9004, 1, 'Approved', 30, 30, 24, 6, ''),
              (9004, 2, 'Rejected', 40, 0, 0, 0, ''),
              (9005, 1, 'Approved', 50, -1, 40, 10, ''),
              (9006, 1, 'Rejected', 60, 60, 0, 0, ''),
              (9008, 1, 'Partially approved', 100, 80, 64, 16, 'BE-1-3'),
              (9009, 1, 'Partially approved', -1, 60, 50, 10, ''),
              (9010, 1, 'Rejected', 40, 0, 0, 0, 'BE-1-3'))
      - input: ref('int_episode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(1) as episode_no, 'OP' as care_type
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
      - input: ref('dim_payer')
        format: sql
        rows: |
          select toInt64(-1) as payer_key
      - input: ref('dim_service')
        format: sql
        rows: |
          select toInt64(-1) as service_key
      - input: ref('dim_nphies_reason')
        format: sql
        rows: |
          select toInt64(-1) as nphies_reason_key
    expect:
      rows:
        - {visit_id: 1, sequence_no: 1, is_latest_submission: 0, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 100, reason_source: NPHIES response, primary_reason_code: BE-1-3, legacy_approved_amount: 0, legacy_rejected_amount: 100, care_type_key: 1}
        - {visit_id: 2, sequence_no: 1, is_latest_submission: 1, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 64, rejected_amount: 20, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 100, care_type_key: 1}
        - {visit_id: 3, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: No response, item_outcome: Not adjudicated, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 50, legacy_rejected_amount: 0, care_type_key: 1}
        - {visit_id: 4, sequence_no: 1, is_latest_submission: 1, submitted_amount: 30, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: 24, rejected_amount: 0, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 30, legacy_rejected_amount: 0, care_type_key: 1}
        - {visit_id: 4, sequence_no: 2, is_latest_submission: 1, submitted_amount: 40, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 40, reason_source: Claim notes, primary_reason_code: MN-1-1, legacy_approved_amount: 0, legacy_rejected_amount: 40, care_type_key: 1}
        - {visit_id: 5, sequence_no: 1, is_latest_submission: 1, submitted_amount: 50, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: 40, rejected_amount: 0, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 50, legacy_rejected_amount: 0, care_type_key: 1}
        - {visit_id: 6, sequence_no: 1, is_latest_submission: 1, submitted_amount: 60, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 60, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 60, care_type_key: 1}
        - {visit_id: 7, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 70, legacy_rejected_amount: 0, care_type_key: 1}
        - {visit_id: 7, sequence_no: 2, is_latest_submission: 1, submitted_amount: null, adjudication_status: Adjudicated, item_outcome: Not adjudicated, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 20, legacy_rejected_amount: 0, care_type_key: 1}
        - {visit_id: 8, sequence_no: 1, is_latest_submission: 1, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 64, rejected_amount: 20, reason_source: NPHIES response, primary_reason_code: BE-1-3, legacy_approved_amount: 64, legacy_rejected_amount: 36, care_type_key: 1}
        - {visit_id: 9, sequence_no: 1, is_latest_submission: 1, submitted_amount: 90, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 50, rejected_amount: 30, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 90, care_type_key: 1}
        - {visit_id: 10, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: Error, item_outcome: Rejected, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 40, care_type_key: 1}
