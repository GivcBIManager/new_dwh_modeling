version: 2

unit_tests:
  - name: fact_claim_line_applies_adjudication_rules
    description: >
      Invoice 500: visit 1 (submission 1) was rejected with BE-1-3; visit 2 (latest) was partially approved
      without a reason. Visit 3 was sent but not answered. Visit 4: line 1 approved with a 20% co-pay
      (rejected 0, legacy rejected 0: the old logic counted the full net amount as approved); line 2 rejected
      with no reason in the response but MN-1-1 in the notes. Visit 5: approved item without an eligible amount
      (rejected 0). Visit 6: rejected item with eligible = submitted (rejected = submitted). Visit 7: marked
      Adjudicated but its response has no matching item, so the line keeps its own outcome and no amounts.
      Visit 8: PARTIAL line whose response carries a reason-bearing adjudication (legacy approved = its
      benefit). Visit 9: partially approved item without a submitted amount (claimed amount is used).
      Visit 10: Error status, so the reason code on its response item is ignored. Visit 11: partially approved
      item with VAT (submitted 115 incl. 15 tax, eligible 80): the tax is not rejected (rejected 20). Only invoice
      500 under transaction 1002 is on an AR statement, so only visit 2 is in the old models' scope.
    model: fact_claim_line
    given:
      - input: ref('stg_oasis__claim_services')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id, toInt64(sq) as sequence_no, toNullable(toInt64(500)) as ios,
                 toNullable('S-1') as service_code, toFloat64(net) as net_amount,
                 if(oc = '', cast(null as Nullable(String)), toNullable(oc)) as outcome,
                 if(nt = '', cast(null as Nullable(String)), toNullable(nt)) as notes
          from values('v UInt32, sq UInt32, net Float64, oc String, nt String',
              (1, 1, 100, 'REJECTED', ''), (2, 1, 100, 'PARTIAL', ''), (3, 1, 50, '', ''),
              (4, 1, 30, 'APPROVED', ''), (4, 2, 40, 'REJECTED', '- MN-1-1 not justified'),
              (5, 1, 50, 'APPROVED', ''), (6, 1, 60, 'REJECTED', ''), (7, 1, 70, 'APPROVED', ''), (7, 2, 20, '', ''),
              (8, 1, 100, 'PARTIAL', ''), (9, 1, 90, 'PARTIAL', ''), (10, 1, 40, 'REJECTED', ''), (11, 1, 115, 'PARTIAL', ''))
      - input: ref('int_claim_submission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id, toNullable(toInt64(inv)) as claim_invoice_no,
                 toNullable('S1') as stat_invoice_no, toNullable(toInt64(100)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toInt64(300)) as purchaser_code, toNullable('O') as claim_type, toNullable(toInt64(1000 + v)) as api_trans_id,
                 toNullable(toDateTime('2026-06-01 09:00:00', 'Asia/Riyadh')) as request_at,
                 toNullable(toDateTime('2026-06-30 00:00:00', 'Asia/Riyadh')) as statement_end_at, toUInt8(0) as is_cancelled,
                 toUInt64(sn) as submission_number, toUInt8(lt) as is_latest_submission, toUInt8(1) as is_sent,
                 if(fr = 0, cast(null as Nullable(Int64)), toNullable(toInt64(fr))) as final_response_id,
                 toNullable(toDateTime('2026-06-05 09:00:00', 'Asia/Riyadh')) as final_responded_at,
                 st as adjudication_status
          from values('v UInt32, inv UInt32, sn UInt32, lt UInt8, fr UInt32, st String',
              (1, 500, 1, 0, 9001, 'Adjudicated'), (2, 500, 2, 1, 9002, 'Adjudicated'),
              (3, 600, 1, 1, 0, 'No response'), (4, 700, 1, 1, 9004, 'Adjudicated'),
              (5, 800, 1, 1, 9005, 'Adjudicated'), (6, 810, 1, 1, 9006, 'Adjudicated'),
              (7, 820, 1, 1, 9007, 'Adjudicated'), (8, 830, 1, 1, 9008, 'Adjudicated'),
              (9, 840, 1, 1, 9009, 'Adjudicated'), (10, 850, 1, 1, 9010, 'Error'), (11, 860, 1, 1, 9011, 'Adjudicated'))
      - input: ref('stg_oasis__episode_invoices')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(i) as invoice_no, toNullable(toInt64(t)) as api_trans_id, toNullable(st) as stat_invoice_no
          from values('i UInt32, t UInt32, st String', (500, 1002, 'S1'), (600, 1003, 'S-NONE'))
      - input: ref('stg_oasis__invoice_statements')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, 'S1' as stat_invoice_no
      - input: ref('int_nphies_adjudication')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(r) as response_id, toInt64(sq) as item_sequence, 'Claim' as response_kind,
                 oc as outcome, if(sub < 0, cast(null as Nullable(Float64)), toNullable(sub)) as submitted,
                 if(elg < 0, cast(null as Nullable(Float64)), toNullable(elg)) as eligible,
                 toNullable(toFloat64(ben)) as benefit, toNullable(toFloat64(cp)) as copay,
                 cast(null as Nullable(Float64)) as deductible, if(tx = 0, cast(null as Nullable(Float64)), toNullable(toFloat64(tx))) as tax,
                 toNullable(toFloat64(cp)) as patient_share, cast(null as Nullable(Float64)) as approved_qty,
                 if(rc = '', cast([] as Array(String)), [rc]) as reason_codes,
                 if(rc = '', cast(null as Nullable(String)), toNullable(rc)) as primary_reason_code,
                 if(rc = '', cast(null as Nullable(Float64)), toNullable(toFloat64(ben))) as legacy_reason_amount
          from values('r UInt32, sq UInt32, oc String, sub Float64, elg Float64, ben Float64, cp Float64, rc String, tx Float64',
              (9001, 1, 'Rejected', 100, 0, 0, 0, 'BE-1-3', 0),
              (9002, 1, 'Partially approved', 100, 80, 64, 16, '', 0),
              (9004, 1, 'Approved', 30, 30, 24, 6, '', 0),
              (9004, 2, 'Rejected', 40, 0, 0, 0, '', 0),
              (9005, 1, 'Approved', 50, -1, 40, 10, '', 0),
              (9006, 1, 'Rejected', 60, 60, 0, 0, '', 0),
              (9008, 1, 'Partially approved', 100, 80, 64, 16, 'BE-1-3', 0),
              (9009, 1, 'Partially approved', -1, 60, 50, 10, '', 0),
              (9010, 1, 'Rejected', 40, 0, 0, 0, 'BE-1-3', 0),
              (9011, 1, 'Partially approved', 115, 80, 64, 16, '', 15))
      - input: ref('int_episode')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(100) as patient_id, toInt64(1) as episode_no, 'OP' as care_type
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(-1) as patient_key
      - input: ref('dim_payer')
        format: sql
        rows: |
          select toInt64(-1) as payer_key
      - input: ref('dim_service')
        format: sql
        rows: |
          select toInt64(-1) as service_key
      - input: ref('dim_nphies_reason')
        format: sql
        rows: |
          select toInt64(-1) as nphies_reason_key
    expect:
      rows:
        - {visit_id: 1, sequence_no: 1, is_latest_submission: 0, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 100, reason_source: NPHIES response, primary_reason_code: BE-1-3, legacy_approved_amount: 0, legacy_rejected_amount: 100, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 2, sequence_no: 1, is_latest_submission: 1, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 64, rejected_amount: 20, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 100, care_type_key: 1, legacy_in_scope: 1}
        - {visit_id: 3, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: No response, item_outcome: Not adjudicated, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 50, legacy_rejected_amount: 0, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 4, sequence_no: 1, is_latest_submission: 1, submitted_amount: 30, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: 24, rejected_amount: 0, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 30, legacy_rejected_amount: 0, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 4, sequence_no: 2, is_latest_submission: 1, submitted_amount: 40, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 40, reason_source: Claim notes, primary_reason_code: MN-1-1, legacy_approved_amount: 0, legacy_rejected_amount: 40, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 5, sequence_no: 1, is_latest_submission: 1, submitted_amount: 50, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: 40, rejected_amount: 0, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 50, legacy_rejected_amount: 0, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 6, sequence_no: 1, is_latest_submission: 1, submitted_amount: 60, adjudication_status: Adjudicated, item_outcome: Rejected, approved_amount: 0, rejected_amount: 60, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 60, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 7, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: Adjudicated, item_outcome: Approved, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 70, legacy_rejected_amount: 0, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 7, sequence_no: 2, is_latest_submission: 1, submitted_amount: null, adjudication_status: Adjudicated, item_outcome: Not adjudicated, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 20, legacy_rejected_amount: 0, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 8, sequence_no: 1, is_latest_submission: 1, submitted_amount: 100, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 64, rejected_amount: 20, reason_source: NPHIES response, primary_reason_code: BE-1-3, legacy_approved_amount: 64, legacy_rejected_amount: 36, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 9, sequence_no: 1, is_latest_submission: 1, submitted_amount: 90, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 50, rejected_amount: 30, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 90, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 10, sequence_no: 1, is_latest_submission: 1, submitted_amount: null, adjudication_status: Error, item_outcome: Rejected, approved_amount: null, rejected_amount: null, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 40, care_type_key: 1, legacy_in_scope: 0}
        - {visit_id: 11, sequence_no: 1, is_latest_submission: 1, submitted_amount: 115, adjudication_status: Adjudicated, item_outcome: Partially approved, approved_amount: 64, rejected_amount: 20, reason_source: Not given, primary_reason_code: null, legacy_approved_amount: 0, legacy_rejected_amount: 115, care_type_key: 1, legacy_in_scope: 0}

  - name: fact_claim_payment_links_remittance_to_claims
    description: >
      Transaction 777 of branch 1 was used by two visits: the remittance line links to the later visit (20),
      with its patient, payer and statement end date, and days to payment counted from that visit's request.
      An advance has no claim transaction, so it keeps visit, patient and payer keys at null / -1.
      Branch 2 holds a remittance line for transaction number 777 but has no such claim, so it must not
      link to branch 1's claim.
    model: fact_claim_payment
    given:
      - input: ref('int_claim_payment')
        format: sql
        rows: |
          select toUInt8(b) as branch_id, toInt64(r) as response_id, concat('urn:rec:', toString(r)) as reconciliation_id, toUInt64(1) as detail_index,
                 if(t = 0, cast(null as Nullable(Int64)), toNullable(toInt64(t))) as claim_api_trans_id,
                 toNullable('PCR') as payer_claim_response_id, dt as detail_type, toNullable(ref) as payment_reference,
                 toNullable(toDate('2026-07-01')) as payment_date,
                 toNullable(toDate('2026-06-01')) as period_start, toNullable(toDate('2026-06-30')) as period_end,
                 toFloat64(amt) as amount, toFloat64(amt) as payment_component, toFloat64(0) as early_fee,
                 toFloat64(0) as nphies_fee
          from values('b UInt8, r UInt32, t UInt32, dt String, ref String, amt Float64',
              (1, 1, 777, 'payment', 'REF-LINKED', 100),
              (1, 2, 0, 'advance', 'REF-ADVANCE', 50),
              (2, 3, 777, 'payment', 'REF-OTHER-BRANCH', 70))
      - input: ref('int_claim_submission')
        format: sql
        rows: |
          select toUInt8(1) as branch_id, toInt64(v) as visit_id, toNullable(toInt64(777)) as api_trans_id,
                 toNullable(toInt64(pt)) as patient_id, toNullable(toInt64(1)) as episode_no,
                 toNullable(toInt64(pu)) as purchaser_code, toNullable(toInt64(inv)) as claim_invoice_no,
                 toNullable(toDateTime(rq, 'Asia/Riyadh')) as request_at,
                 toNullable(toDateTime('2026-06-30 00:00:00', 'Asia/Riyadh')) as statement_end_at
          from values('v UInt32, pt UInt32, pu UInt32, inv UInt32, rq String',
              (10, 100, 300, 500, '2026-06-01 09:00:00'),
              (20, 101, 301, 600, '2026-06-10 09:00:00'))
      - input: ref('dim_patient')
        format: sql
        rows: |
          select toInt64(k) as patient_key from values('k Int64',
              (-1), (891078230665751689), (4713611487329175983))
      - input: ref('dim_payer')
        format: sql
        rows: |
          select toInt64(k) as payer_key from values('k Int64',
              (-1), (1045677814304990889), (2553637903548178439))
    expect:
      rows:
        - {payment_reference: REF-LINKED, reconciliation_id: 'urn:rec:1', visit_id: 20, claim_api_trans_id: 777, patient_key: 4713611487329175983, payer_key: 2553637903548178439, statement_end_date_key: 20260630, days_to_payment: 21}
        - {payment_reference: REF-ADVANCE, reconciliation_id: 'urn:rec:2', visit_id: null, claim_api_trans_id: null, patient_key: -1, payer_key: -1, statement_end_date_key: null, days_to_payment: null}
        - {payment_reference: REF-OTHER-BRANCH, reconciliation_id: 'urn:rec:3', visit_id: null, claim_api_trans_id: 777, patient_key: -1, payer_key: -1, statement_end_date_key: null, days_to_payment: null}
