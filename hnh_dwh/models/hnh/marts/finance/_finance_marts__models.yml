version: 2

models:
  - name: hnh_fact_gl_journal_line
    description: One Fusion actual journal line, posted or not (is_posted). Rebuilt in full every night.
    columns:
      - name: gl_journal_line_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: gl_account_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_account'), field: gl_account_key}
      - name: period_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_period'), field: period_key}
      - name: accounting_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}

  - name: fact_gl_balance_monthly
    description: >
      Code combination × period × balance view (posted, including_unposted), densified from the account's first
      posting to the latest period with a posting or already started. Opening and closing balances stored.
    tests:
      - hnh_unique_combination:
          columns: [balance_view, gl_account_key, period_key]
    columns:
      - name: balance_view
        tests:
          - accepted_values:
              values: ['posted', 'including_unposted']
      - name: gl_account_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_account'), field: gl_account_key}
      - name: period_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_period'), field: period_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
  - name: fact_budget_monthly
    tests:
      - hnh_unique_combination:
          columns: [branch_key, budget_line_code, scenario, month_start]
    columns:
      - name: budget_line_key
        tests:
          - relationships: {to: ref('dim_budget_line'), field: budget_line_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: month_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_income_statement_monthly
    tests:
      - hnh_unique_combination:
          columns: [branch_key, month_start, budget_line_code, revenue_care_type, statement_group]
    columns:
      - name: budget_line_key
        tests:
          - relationships: {to: ref('dim_budget_line'), field: budget_line_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: month_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_ap_invoice_line
    columns:
      - name: ap_invoice_line_key
        tests: [unique, not_null]
      - name: supplier_key
        tests:
          - relationships: {to: ref('hnh_dim_supplier'), field: supplier_key}
      - name: gl_account_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_account'), field: gl_account_key}
      - name: period_key
        tests:
          - relationships: {to: ref('hnh_dim_gl_period'), field: period_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: invoice_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: accounting_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: hnh_fact_ap_payment
    columns:
      - name: ap_payment_key
        tests: [unique, not_null]
      - name: supplier_key
        tests:
          - relationships: {to: ref('hnh_dim_supplier'), field: supplier_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: payment_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_ap_open_item
    columns:
      - name: ap_open_item_key
        tests: [unique, not_null]
      - name: ageing_bucket
        tests:
          - accepted_values:
              values: ['Settled', 'Not due', '1-30', '31-60', '61-90', '91-180', 'Over 180']
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: supplier_key
        tests:
          - relationships: {to: ref('hnh_dim_supplier'), field: supplier_key}
      - name: invoice_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: due_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_gl_fs_monthly
    description: >
      Monthly GL balances per branch (1-8) and account for the bsc finance views: Oasis GL before the branch's first
      Fusion GL month (default.map_gl_cutover), Fusion GL from it (bsc spec section 5). Debit positive. FS levels are
      lower case in the old fs_mapping vocabulary (Oasis) or dim_fs_line's (Fusion).
    columns:
      - name: account_code
        description: Oasis main + sub account, or the Fusion natural account (segment 2) summed over its combinations.
      - name: branch_key
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false}
      - name: source_system
        tests:
          - accepted_values: {values: ['oasis', 'fusion']}
      - name: debit
        description: Debit side of the month's movement, >= 0, opening-balance and brought-forward lines out. Oasis - posted lines; Fusion - journal lines, posted or not.
      - name: credit
        description: Credit side of the month's movement, >= 0, same scope as debit. debit - credit = movement.
      - name: account_name
        description: Account name (Oasis account name, Fusion natural account name), title-cased; the account code where the source has none.
  - name: dim_pl_report_line
    description: >
      Lines of the Fusion HNH profitability (P&L) report in report order: detail lines, a Not mapped line per section,
      and subtotals that add the sections listed in subtotal_sections.
    columns:
      - name: pl_line_key
        description: Report order of the line.
        tests: [unique, not_null]
      - name: pl_line_code
        tests: [unique, not_null]
      - name: pl_line_name
        description: Exact wording of the Fusion report; repeats across sections (Not mapped, Kitchen Expenses ...).
      - name: pl_line_label
        description: Unique display name; pl_line_name, or pl_line_name - section_name where the name repeats (a line named like its own section keeps the bare name). The cube sorts it by pl_line_key.
        tests: [unique, not_null]
      - name: section_key
        description: Smallest pl_line_key of the section's lines; sorts the sections in report order.
      - name: line_kind
        tests:
          - accepted_values: {values: ['detail', 'not_mapped', 'subtotal']}
  - name: pl_report_line_rule
    description: >
      Match rules from lower-case income-statement labels to a report line. '' in source_system, fs_caption or fs_line
      matches anything; score ranks the rules (source 1, caption 2, line 4) and the highest matching score wins.
    tests:
      - hnh_unique_combination:
          columns: [source_system, fs_category, fs_caption, fs_line]
    columns:
      - name: fs_category
        tests: [not_null]
      - name: pl_line_code
        tests:
          - not_null
          - relationships: {to: ref('dim_pl_report_line'), field: pl_line_code}
  - name: fact_pl_report_monthly
    description: >
      The P&L (Fusion HNH profitability report) by branch, month and report line, credit positive (revenue positive,
      costs negative). Branches 1-8 take the Oasis rows of fact_gl_fs_monthly before their first Fusion GL month and
      the Fusion GL (including unposted, opening-balance journals out) from it; Head Office (100) is always Fusion.
      Detail rows carry the account, its lower-case FS labels and the Fusion slicer names (Unallocated for Oasis);
      subtotal rows ('' account and labels) add the detail and not-mapped lines of the sections they list. Rows that
      round to zero are left out.
    columns:
      - name: branch_key
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8, 100], quote: false}
      - name: source_system
        tests:
          - accepted_values: {values: ['oasis', 'fusion']}
      - name: pl_line_key
        tests:
          - relationships: {to: ref('dim_pl_report_line'), field: pl_line_key}
      - name: account_code
        description: Oasis main + sub account or the Fusion natural account; '' on subtotal rows.
      - name: account_name
        description: Account name, title-cased (Oasis from fact_gl_fs_monthly, Fusion the natural account name); the account code where it has no name; '' on subtotal rows.
      - name: amount
        description: Movement of the month, credit positive (-movement of the GL).
