        - {fusion_transaction_id: 502, oasis_line_id: null, source_system: 'fusion', receipt_type: 'RETURN TO VENDOR', date_key: 20260720, quantity: -2, unit_price: 5, received_value: -10, free_quantity: 0, is_free_of_charge: 0, lot_number: 'V2', expiry_date: null, store_key: 3391680798086060577, purchase_line_key: 3303836444277286057}
