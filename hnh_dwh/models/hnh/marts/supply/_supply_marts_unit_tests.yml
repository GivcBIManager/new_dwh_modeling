  - name: fact_goods_receipt_receipts_and_returns
    description: >
      Jazan buys in Fusion from 202607. Fusion receipt 500 (12 July, 8 at 5 on schedule 10) is delivered by 501 into
      subinventory PH01, whose inventory line carries lot L1 / 2027-01-31 (the vendor lot V1 is not used). Fusion return
      502 (20 July, 2 at 5) has no delivery: organisation-level store, vendor lot V2, quantity and value negative.
      Receipt 503 (30 June) is before the first Fusion purchasing month and left out; the DELIVER row is not a receipt.
      Oasis GRN line 70 (15 July, 20 received for 140, 2 free, on PO line 50) and return to supplier line 80 (STOCKISS
      RFN, 3 for -21, referencing GRN line 70) are kept; the return resolves to PO line 50 through its GRN line and
      carries RETURN TO VENDOR. Patient-sale line 90 is not a receipt.
    model: fact_goods_receipt
    given:
      - input: ref('stg_ref__scm_cutover')
        format: sql
        rows: |
          select toUInt8(3) as branch_id, toNullable(toInt32(202607)) as first_fusion_purchasing_month
      - input: ref('stg_fusion__receipt_transactions')
        format: sql
        rows: |
          select toInt64(t) as transaction_id, if(p = 0, cast(null as Nullable(Int64)), toNullable(toInt64(p))) as parent_transaction_id,
                 toNullable(tt) as transaction_type, toNullable(toInt64(10)) as po_line_location_id, toNullable(toInt64(3004)) as organization_id,
                 if(sub = '', cast(null as Nullable(String)), toNullable(sub)) as subinventory_code, toNullable(toInt64(5)) as vendor_id,
                 toNullable(toInt64(7)) as vendor_site_id, toNullable(toInt64(500)) as item_id,
                 if(vl = '', cast(null as Nullable(String)), toNullable(vl)) as vendor_lot_number, toNullable(toDate(d)) as transaction_date,
                 toFloat64(q) as quantity, toFloat64(q) as primary_quantity, toFloat64(5) as po_unit_price, toFloat64(0) as amount
          from values('t UInt32, p UInt32, tt String, sub String, vl String, d String, q Float64',
              (500, 0, 'RECEIVE', '', 'V1', '2026-07-12', 8), (501, 500, 'DELIVER', 'PH01', '', '2026-07-12', 8),
              (502, 0, 'RETURN TO VENDOR', '', 'V2', '2026-07-20', 2), (503, 0, 'RECEIVE', '', '', '2026-06-30', 4))
      - input: ref('int_inventory_org_branch')
        format: sql
        rows: |
          select toInt64(3004) as organization_id, toUInt8(3) as branch_key
      - input: ref('int_fusion_stock_line')
        format: sql
        rows: |
          select toNullable(toInt64(501)) as rcv_transaction_id, toNullable('L1') as lot_number, toNullable(toDate32('2027-01-31')) as expiry_date
      - input: ref('int_oasis_stock_line')
        format: sql
        rows: |
          select toUInt8(3) as branch_key, toInt64(l) as oasis_line_id, toDate32(d) as line_date, mt as movement_type,
                 toNullable('210103-901') as account_code, toInt64(1) as item_key, toNullable(toInt64(36)) as store_id,
                 if(x = 0, cast(null as Nullable(Int64)), toNullable(toInt64(x))) as cross_ref_line_id, toFloat64(q) as primary_quantity,
                 toFloat64(7) as unit_cost, toFloat64(c) as cost_amount, toFloat64(bq) as bonus_quantity, toNullable('B1') as lot_number,
                 toNullable(toDate32('2027-06-30')) as expiry_date
          from values('l UInt32, d String, mt String, x UInt32, q Float64, c Float64, bq Float64',
              (70, '2026-07-15', 'Goods receipt', 50, 20, 140, 2), (80, '2026-07-28', 'Return to supplier', 70, -3, -21, 0),
              (90, '2026-07-16', 'Patient sale', 0, -1, -7, 0))
      - input: ref('hnh_dim_supplier')
        format: sql
        rows: |
          select toInt64(1) as supplier_key
      - input: ref('hnh_dim_item')
        format: sql
        rows: |
          select toInt64(1) as item_key
      - input: ref('dim_store')
        format: sql
        rows: |
          select toInt64(bitShiftRight(cityHash64(concat(toString('fusion'), '|', toString(3004), '|', toString(s), '|')), 1)) as store_key
          from values('s String', ('PH01'), ('*'))
      - input: ref('fact_purchase_line')
        format: sql
        rows: |
          select toInt64(bitShiftRight(cityHash64(concat(toString('fusion'), '|', toString(10), '|')), 1)) as purchase_line_key
          union all
          select toInt64(bitShiftRight(cityHash64(concat(toString('oasis'), '|', toString(3), '|', toString(50), '|')), 1))
    expect:
      # store_key: hash('fusion', 3004, 'PH01') = 3065739768012781067, hash('fusion', 3004, '*') = 3391680798086060577
      # (Oasis store 36 is not in the dim_store fixture: -1); purchase_line_key: hash('fusion', 10) = 3303836444277286057,
      # hash('oasis', 3, 50) = 5802234965275792194
