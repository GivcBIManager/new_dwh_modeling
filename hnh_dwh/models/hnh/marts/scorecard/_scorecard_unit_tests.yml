version: 2

unit_tests:
  - name: fact_bsc_target_monthly_branch_row_beats_all_hospitals_row
    description: >
      INT_ALOS March 2026 is 0.5 for every hospital and 0.7 for Abha (6): Abha gets 0.7, the other seven 0.5.
    model: fact_bsc_target_monthly
    overrides:
      vars: {hnh_bsc_as_of: '2026-10-12'}
    given:
      - input: ref('stg_ref__bsc_target')
        format: sql
        rows: |
          select 'INT_ALOS' as kpi_code, toUInt8(b) as branch_id, toUInt16(2026) as year, toUInt8(3) as month,
                 toFloat64(v) as target_value, toUInt8(0) as scale_with_months, s as source_basis,
                 toDateTime64('2026-10-01 00:00:00', 3) as last_changed_at
          from values('b UInt8, v Float64, s String', (0, 0.5, 'all'), (6, 0.7, 'abha'))
      - input: ref('stg_ref__bsc_kpi')
        format: sql
        rows: |
          select 'INT_ALOS' as kpi_code, toUInt16(23) as kpi_num, 'ALOS' as kpi_name, 'ALOS' as short_label, 'P1' as objective_code,
                 'Supporting' as kpi_type, 'lower' as direction, 'days' as value_format, 'line' as chart_hint,
                 toUInt16(23) as display_order, '' as definition, 'active' as status, 'fixed' as target_source,
                 'measure' as value_source, 'beds' as detail_page, toDateTime64('2026-10-01 00:00:00', 3) as last_changed_at
    expect:
      format: sql
      rows: |
        select toInt64(bitShiftRight(cityHash64(concat('INT_ALOS', '|')), 1)) as bsc_kpi_key, toUInt8(number + 1) as branch_key,
               toInt32(20260301) as month_date_key, toFloat64(if(number + 1 = 6, 0.7, 0.5)) as target_value,
               toUInt8(0) as scale_with_months, if(number + 1 = 6, 'abha', 'all') as source_basis
        from numbers(8)
        -- only March has a row: the other months of 2026 get no target (no annual row to carry)

  - name: fact_bsc_weight_branch_profile_else_corporate
    description: >
      Abha (6) has a profile that weights FIN_NET_REVENUE 0.05 and leaves INT_ALOS out (0); the other hospitals have
      no profile and take the corporate weights 0.042 and 0.02. The parked KPI gets no rows.
    model: fact_bsc_weight
    given:
      - input: ref('stg_ref__bsc_kpi')
        format: sql
        rows: |
          select k as kpi_code, toUInt16(1) as kpi_num, k as kpi_name, k as short_label, 'F1' as objective_code,
                 'Primary' as kpi_type, 'higher' as direction, 'pct' as value_format, 'line' as chart_hint,
                 toUInt16(1) as display_order, '' as definition, st as status, 'fixed' as target_source,
                 'measure' as value_source, 'revenue' as detail_page, toDateTime64('2026-10-01 00:00:00', 3) as last_changed_at
          from values('k String, st String', ('FIN_NET_REVENUE', 'active'), ('INT_ALOS', 'active'), ('FIN_NET_COLLECTION', 'parked'))
      - input: ref('stg_ref__bsc_weight')
        format: sql
        rows: |
          select p as profile, k as kpi_code, toFloat64(w) as weight, toDateTime64('2026-10-01 00:00:00', 3) as last_changed_at
          from values('p String, k String, w Float64', ('corporate', 'FIN_NET_REVENUE', 0.042), ('corporate', 'INT_ALOS', 0.02),
                      ('branch:6', 'FIN_NET_REVENUE', 0.05))
    expect:
      format: sql
      rows: |
        select toInt64(bitShiftRight(cityHash64(concat(k, '|')), 1)) as bsc_kpi_key, toUInt8(b) as branch_key,
               toFloat64(multiIf(b = 6 and k = 'FIN_NET_REVENUE', 0.05, b = 6, 0, k = 'FIN_NET_REVENUE', 0.042, 0.02)) as weight
        from (select arrayJoin(['FIN_NET_REVENUE', 'INT_ALOS']) as k) as kpis cross join (select toUInt8(number + 1) as b from numbers(8)) as branches

  - name: fact_bsc_workforce_monthly_keeps_vw_work_force_people
    description: >
      Same people as the bsc_vw_work_force unit test, as of 2026-10-12: paid 501 in December 2025; Fusion employees
      101, 102 (no staff link) and 103 in September 2026 (contingent 104 and the open October left out); revenue-only
      doctor 14 as a part-time doctor (0.5 FTE, not Saudi); resignations of Khamis staff 31 (Oasis), Abha staff 33
      before Fusion HR (Oasis) and Abha employee 701 (Fusion voluntary leaver). Only nurse 101 (category NURSE) is
      clinical staff (is_medical); doctors are not.
    model: fact_bsc_workforce_monthly
    overrides:
      vars: {hnh_bsc_as_of: '2026-10-12'}
    given:
      - input: ref('dim_staff')
        format: sql
        rows: |
          select toInt64(k) as staff_key, toUInt8(b) as branch_key, toNullable(c) as classification, toNullable(g) as category,
                 toDate32OrNull(t) as termination_date, if(r = '', null, toNullable(r)) as termination_reason, toUInt8(k in (14, 21)) as is_saudi
          from values('k UInt32, b UInt8, c String, g String, t String, r String',
              (11, 1, 'NURSE', 'NURSE', '', ''), (13, 1, 'DOC', 'DOCTORS', '', ''), (14, 1, 'DOC', 'DOCTORS', '', ''),
              (15, 1, 'DOC', 'DOCTORS', '', ''), (16, 1, 'NURSE', 'NURSING', '', ''), (17, 1, 'DOC', 'DOCTORS', '', ''),
              (21, 1, 'DOC', 'DOCTORS', '', ''), (22, 1, 'ADMIN', 'ADMIN', '', ''),
              (31, 2, 'ADMIN', 'ADMIN', '2026-09-15', 'Resignation'), (32, 6, 'ADMIN', 'ADMIN', '2026-09-10', 'Resignation'),
              (33, 6, 'ADMIN', 'ADMIN', '2025-12-10', 'Resignation'))
      - input: ref('fact_headcount_monthly')
        format: sql
        rows: |
          select toUInt8(b) as branch_key, toDate(m) as month_end, toInt64(e) as employee_key, toInt64(s) as staff_key,
                 toUInt8(1) as headcount, toFloat64(1) as fte, toUInt8(c) as is_contingent, toUInt8(e in (101, 103, 104)) as is_saudi,
                 toInt64(e + 800) as hr_department_key, toInt64(10) as job_key, toInt64(20) as grade_key, toInt64(30) as position_key,
                 toInt64(40) as location_key
          from values('b UInt8, m String, e UInt32, s Int64, c UInt8',
              (1, '2026-09-30', 101, 11, 0), (1, '2026-09-30', 102, -1, 0), (1, '2026-09-30', 103, 13, 0),
              (1, '2026-09-30', 104, -1, 1), (1, '2026-10-31', 101, 11, 0))
      - input: ref('fact_payroll_monthly')
        format: sql
        rows: |
          select toUInt8(b) as branch_key, toInt32(m) as month_date_key, toInt64(p) as paid_person_key, toInt64(s) as staff_key,
                 toFloat64(g) as gross_pay, toNullable(toUInt8(r)) as is_parallel_run
          from values('b UInt8, m UInt32, p UInt32, s Int64, g Float64, r UInt8',
              (1, 20251201, 501, 21, 100, 0), (1, 20251201, 502, 22, 0, 0), (1, 20251201, 503, 22, 50, 1),
              (1, 20260901, 601, 15, 200, 0))
      - input: ref('fact_charge_line')
        format: sql
        rows: |
          select toUInt8(b) as branch_key, toInt32(d) as delivery_date_key, toInt64(s) as staff_key, toFloat64(a) as revenue_amount
          from values('b UInt8, d UInt32, s Int64, a Float64',
              (1, 20260905, 13, 100), (1, 20260905, 14, 100), (1, 20260906, 14, 50), (1, 20260905, 15, 100),
              (1, 20260905, 16, 100), (1, 20260905, 17, 100), (1, 20260906, 17, -100))
      - input: ref('hnh_fact_worker_movement')
        format: sql
        rows: |
          select toUInt8(b) as branch_key, toInt32(d) as action_date_key, toUInt8(v) as is_voluntary_leaver,
                 toInt64(e) as employee_key, toInt64(-1) as staff_key, toInt64(906) as hr_department_key, toInt64(11) as job_key,
                 toInt64(21) as grade_key, toInt64(31) as position_key, toInt64(41) as location_key, toInt64(7) as worker_action_key
          from values('b UInt8, d UInt32, v UInt8, e UInt32', (6, 20260920, 1, 701), (6, 20260921, 0, 702), (2, 20260920, 1, 703))
    expect:
      format: sql
      rows: |
        select toUInt8(b) as branch_key, toInt32(m) as month_date_key, p as person_id, t as row_type, toInt64(s) as staff_key,
               toInt64(e) as employee_key, toUInt8(h) as headcount, toFloat64(f) as fte, toUInt8(d) as is_doctor,
               toUInt8(md) as is_medical, toUInt8(sa) as is_saudi, toUInt8(r) as resignations, ds as data_source,
               toInt64(hd) as hr_department_key, toInt64(j) as job_key, toInt64(g) as grade_key, toInt64(po) as position_key,
               toInt64(lo) as location_key, toInt64(wa) as worker_action_key
        from values('b UInt8, m Int32, p String, t String, s Int64, e Int64, h UInt8, f Float64, d UInt8, md UInt8, sa UInt8, r UInt8, ds String, hd Int64, j Int64, g Int64, po Int64, lo Int64, wa Int64',
            (1, 20251231, 'paid-501', 'head', 21, -1, 1, 1, 1, 0, 1, 0, 'oasis', -1, -1, -1, -1, -1, -1),
            (1, 20260930, '101', 'head', 11, 101, 1, 1, 0, 1, 1, 0, 'fusion', 901, 10, 20, 30, 40, -1),
            (1, 20260930, '102', 'head', -1, 102, 1, 1, 0, 0, 0, 0, 'fusion', 902, 10, 20, 30, 40, -1),
            (1, 20260930, '103', 'head', 13, 103, 1, 1, 1, 0, 1, 0, 'fusion', 903, 10, 20, 30, 40, -1),
            (1, 20260930, 'pt-14', 'pt_doctor', 14, -1, 1, 0.5, 1, 0, 0, 0, 'oasis', -1, -1, -1, -1, -1, -1),
            (2, 20260930, 'staff-31', 'resignation', 31, -1, 0, 0, 0, 0, 0, 1, 'oasis', -1, -1, -1, -1, -1, -1),
            (6, 20251231, 'staff-33', 'resignation', 33, -1, 0, 0, 0, 0, 0, 1, 'oasis', -1, -1, -1, -1, -1, -1),
            (6, 20260930, 'emp-701', 'resignation', -1, 701, 0, 0, 0, 0, 0, 1, 'fusion', 906, 11, 21, 31, 41, 7))
