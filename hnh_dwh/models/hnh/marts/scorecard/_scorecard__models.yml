version: 2

# Balanced-scorecard configuration resolved for SSAS (bsc ssas spec 6.2). Labels are repo-defined, not title-cased.
models:
  - name: dim_bsc_kpi
    description: One row per scorecard KPI with its objective, pillar, thresholds, Corporate owner and corporate weight.
    columns:
      - name: bsc_kpi_key
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
      - name: kpi_code
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
      - name: pillar
        tests:
          - accepted_values: {values: ['Financial', 'Customer', 'Internal Process', 'Learning & Growth'], config: {severity: warn}}
  - name: fact_bsc_target_monthly
    description: Fixed KPI targets per hospital and month; the most specific config row wins.
    tests:
      - hnh_unique_combination:
          columns: [bsc_kpi_key, branch_key, month_date_key]
          config: {severity: warn}
    columns:
      - name: bsc_kpi_key
        tests:
          - relationships: {to: ref('dim_bsc_kpi'), field: bsc_kpi_key, config: {severity: warn}}
      - name: branch_key
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false, config: {severity: warn}}
  - name: fact_bsc_weight
    description: Weight of each active KPI inside its pillar, per hospital.
    tests:
      - hnh_unique_combination:
          columns: [bsc_kpi_key, branch_key]
          config: {severity: warn}
    columns:
      - name: bsc_kpi_key
        tests:
          - relationships: {to: ref('dim_bsc_kpi'), field: bsc_kpi_key, config: {severity: warn}}
      - name: branch_key
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false, config: {severity: warn}}
  - name: fact_bsc_manual_value
    description: Monthly KPI values entered by the BI manager.
    tests:
      - hnh_unique_combination:
          columns: [bsc_kpi_key, branch_key, month_date_key]
          config: {severity: warn}
    columns:
      - name: bsc_kpi_key
        tests:
          - relationships: {to: ref('dim_bsc_kpi'), field: bsc_kpi_key, config: {severity: warn}}
      - name: branch_key
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false, config: {severity: warn}}
  - name: fact_bsc_budgeted_fte
    description: Budgeted FTE per hospital and year (job vacancy rate denominator).
    tests:
      - hnh_unique_combination:
          columns: [branch_key, year_date_key]
          config: {severity: warn}
    columns:
      - name: branch_key
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false, config: {severity: warn}}
  - name: dim_bsc_parameter
    description: Scorecard parameters as one row (clinic hours per day, patients per hour, ancillary target share).
  - name: fact_bsc_licensed_beds
    description: Licensed beds per hospital and year (KPI 60), carried into later years.
    tests:
      - hnh_unique_combination:
          columns: [branch_key, year_date_key]
          config: {severity: warn}
