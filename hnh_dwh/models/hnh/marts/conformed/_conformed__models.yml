version: 2

models:
  - name: hnh_dim_branch
    columns:
      - name: branch_key
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]
      - name: hijri_year
        tests: [not_null]
  - name: dim_time
    columns:
      - name: time_key
        tests: [unique, not_null]
      - name: shift
        tests:
          - accepted_values:
              values: ["00:00-08:00", "08:00-12:00", "12:00-16:30", "16:30-24:00"]
  - name: dim_care_type
    columns:
      - name: care_type_key
        tests: [unique, not_null]
      - name: care_type
        tests:
          - accepted_values:
              values: ["OP", "ER", "IP", "DAYCASE", "Unknown"]
  - name: dim_admission_source
    columns:
      - name: admission_source_key
        tests: [unique, not_null]
  - name: dim_procedure_type
    columns:
      - name: procedure_type_key
        tests: [unique, not_null]
  - name: hnh_dim_department
    columns:
      - name: department_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships:
              to: ref('hnh_dim_branch')
              field: branch_key
      - name: unified_department
        tests: [not_null]
      - name: care_setting
        tests:
          - accepted_values:
              values: ["OP", "IP", "ER", "Theatre", "Ancillary", "Support", "Unknown"]
  - name: dim_payer
    columns:
      - name: payer_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships:
              to: ref('hnh_dim_branch')
              field: branch_key
      - name: creditor
        tests: [not_null]
  - name: dim_patient
    columns:
      - name: patient_key
        tests: [unique, not_null]
      - name: person_key
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values:
              values: ["Male", "Female", "Unknown"]
      - name: person_key_source
        tests:
          - accepted_values:
              values: ["National id or iqama", "Passport", "Border number", "Local", "Unknown"]
  - name: dim_patient_pii
    columns:
      - name: patient_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_patient')
              field: patient_key
  - name: dim_staff
    columns:
      - name: staff_key
        tests: [unique, not_null]
      - name: unified_specialty
        tests: [not_null]
      - name: contract_status
        tests:
          - accepted_values:
              values: ["Active", "Terminated", "No contract", "Unknown"]
      - name: home_department_key
        tests:
          - relationships:
              to: ref('hnh_dim_department')
              field: department_key
  - name: dim_bed
    columns:
      - name: bed_key
        tests: [unique, not_null]
      - name: classification
        tests:
          - accepted_values:
              values: ["Critical", "Intermediate Care", "Non Critical", "Non-Admitting Unit", "Not Mapped", "Unknown"]
      - name: current_department_key
        tests:
          - relationships:
              to: ref('hnh_dim_department')
              field: department_key
  - name: dim_eligibility_type
    columns:
      - name: eligibility_type_key
        tests: [unique, not_null]
  - name: dim_appointment_outcome
    columns:
      - name: outcome_key
        tests: [unique, not_null]
      - name: outcome_group
        tests:
          - accepted_values:
              values: ["Attended", "Cancelled", "Rescheduled", "No-show recorded", "Left without being seen", "Admitted", "Referred", "Left against advice", "Died", "Other", "Unknown"]
  - name: dim_discharge_outcome
    columns:
      - name: discharge_outcome_key
        tests: [unique, not_null]
      - name: outcome_group
        tests:
          - accepted_values:
              values: ["Normal discharge", "Left against advice", "Died", "Transferred out", "Transferred to another episode", "Wrong admission", "Absconded", "Other", "Unknown"]
  - name: dim_er_priority
    columns:
      - name: er_priority_key
        tests: [unique, not_null]
  - name: sec_user_access
    tests:
      - hnh_unique_combination:
          columns: [login_name, branch_key, unified_specialty]
    columns:
      - name: login_name
        tests: [not_null]
      - name: source_user_name
        tests: [not_null]
      - name: branch_key
        tests:
          - not_null
          - relationships:
              to: ref('hnh_dim_branch')
              field: branch_key
  - name: dim_service
    columns:
      - name: service_key
        tests: [unique, not_null]
  - name: dim_product_category
    columns:
      - name: product_category_key
        tests: [unique, not_null]
  - name: dim_preauth_outcome
    columns:
      - name: preauth_outcome_key
        tests: [unique, not_null]
      - name: preauth_outcome
        tests:
          - accepted_values:
              values: ['Approved', 'Partially approved', 'Not required', 'Rejected', 'Pended', 'Error', 'Cancelled', 'Not sent', 'Unknown']
  - name: dim_nphies_reason
    columns:
      - name: nphies_reason_key
        tests: [unique, not_null]
  - name: hnh_dim_gl_period
    columns:
      - name: period_key
        tests: [unique, not_null]
      - name: period_name
        tests: [unique, not_null]
  - name: hnh_dim_supplier
    columns:
      - name: supplier_key
        tests: [unique, not_null]
  - name: dim_fs_line
    columns:
      - name: fs_line_key
        tests: [unique, not_null]
      - name: statement_group
        tests:
          - not_null
          - accepted_values:
              values: ['Balance sheet', 'Revenue', 'Revenue discounts', 'Direct cost', 'G&A', 'Selling and marketing',
                       'Charges from head office', 'Other income', 'Depreciation and amortisation', 'Finance cost',
                       'Zakat', 'OCI', 'Not mapped expenses']
  - name: dim_budget_line
    columns:
      - name: budget_line_key
        tests: [unique, not_null]
      - name: budget_line_code
        tests: [unique, not_null]
  - name: hnh_dim_gl_account
    columns:
      - name: gl_account_key
        tests: [unique, not_null]
      - name: fs_line_key
        tests:
          - not_null
          - relationships: {to: ref('dim_fs_line'), field: fs_line_key}
      - name: budget_line_code
        tests:
          - relationships: {to: ref('dim_budget_line'), field: budget_line_code}
      - name: fs_mapping_source
        tests:
          - accepted_values:
              values: ['supplied', 'inferred', 'not mapped', 'prior-year roll']
