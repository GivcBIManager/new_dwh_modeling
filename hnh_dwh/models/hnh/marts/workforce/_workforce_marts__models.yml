version: 2

models:
  - name: fact_headcount_monthly
    tests:
      - hnh_unique_combination:
          columns: [employee_key, month_date_key]
    columns:
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: hr_department_key
        tests:
          - relationships: {to: ref('hnh_dim_hr_department'), field: hr_department_key}
      - name: job_key
        tests:
          - relationships: {to: ref('hnh_dim_job'), field: job_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: grade_key
        tests:
          - relationships: {to: ref('hnh_dim_grade'), field: grade_key}
      - name: position_key
        tests:
          - relationships: {to: ref('hnh_dim_position'), field: position_key}
      - name: location_key
        tests:
          - relationships: {to: ref('hnh_dim_location'), field: location_key}
      - name: month_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: hnh_fact_worker_movement
    columns:
      - name: movement_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: previous_branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: worker_action_key
        tests:
          - relationships: {to: ref('hnh_dim_worker_action'), field: worker_action_key}
      - name: action_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: hr_department_key
        tests:
          - relationships: {to: ref('hnh_dim_hr_department'), field: hr_department_key}
      - name: previous_hr_department_key
        tests:
          - relationships: {to: ref('hnh_dim_hr_department'), field: hr_department_key}
      - name: job_key
        tests:
          - relationships: {to: ref('hnh_dim_job'), field: job_key}
      - name: previous_job_key
        tests:
          - relationships: {to: ref('hnh_dim_job'), field: job_key}
      - name: grade_key
        tests:
          - relationships: {to: ref('hnh_dim_grade'), field: grade_key}
      - name: previous_grade_key
        tests:
          - relationships: {to: ref('hnh_dim_grade'), field: grade_key}
      - name: position_key
        tests:
          - relationships: {to: ref('hnh_dim_position'), field: position_key}
      - name: previous_position_key
        tests:
          - relationships: {to: ref('hnh_dim_position'), field: position_key}
      - name: location_key
        tests:
          - relationships: {to: ref('hnh_dim_location'), field: location_key}
      - name: previous_location_key
        tests:
          - relationships: {to: ref('hnh_dim_location'), field: location_key}

  - name: fact_payroll_monthly
    columns:
      - name: payroll_key
        tests: [unique, not_null]
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: pay_category_key
        tests:
          - relationships: {to: ref('dim_pay_category'), field: pay_category_key}
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: paid_person_key
        description: >
          One key per person across payroll sources: employee_key when the payee resolves to an employee (Fusion pay, and
          Oasis staff linked through bridge_employee_staff), else payee_key. payee_key hashes source, branch and person or
          staff, so a person paid by Oasis and then by Fusion counts twice across a cutover; paid headcount over several
          months is a distinct count of paid_person_key over rows with gross pay.
      - name: amount
        description: >
          Signed amount of every pay category, including parallel-run rows and the Not pay category (GOSI reference
          earnings). Do not sum it as a payroll measure: hide it in SSAS or use it only with a pay-category filter and
          is_parallel_run = 0. Payroll measures use cost_amount and gross_pay (2026: Σ amount 541.9M against Σ cost_amount
          379.5M; parallel-run rows add 50.1M and Not pay 123.5M).
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: hr_department_key
        tests:
          - relationships: {to: ref('hnh_dim_hr_department'), field: hr_department_key}
      - name: month_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: source
        tests:
          - accepted_values:
              values: ['oasis', 'fusion']
      - name: is_closed_payroll
        description: >
          1 for closed payroll (Oasis status C, every Fusion row), 0 for Oasis payroll still in progress (status P, reduced
          to each staff's latest run by int_oasis_payroll_line, spec 12.2). Open figures can change until the branch closes
          the month.
      - name: payroll_status
        description: Per payee and month (spec 12.3); Closed, Open (all lines open) or Partly closed (both).
        tests:
          - accepted_values:
              values: ['Closed', 'Open', 'Partly closed']
      - name: open_run_date
        description: Latest Oasis calculation date of the payee's open lines in the month; null when the payee is closed.
      - name: oasis_payment_amount
        description: >
          Oasis pay before deductions, by the payroll team's salary report: the positive lines paid through the payroll
          (payable type P, pay in payroll Y, payment method C or R). Every negative Oasis line is a deduction, on any pay
          code (a recovery or reversal on an earnings code too), and QuickPay lines are not payroll payments. 0 for Fusion
          rows and parallel-run rows; amount and gross_pay still net the negative lines.
      - name: oasis_deduction_amount
        description: >
          Oasis deductions by the same rule: the negative lines paid through the payroll (payable type P, pay in payroll Y,
          payment method C or R), on any pay code. oasis_payment_amount + oasis_deduction_amount is the net salary of the
          payroll team's report. 0 for Fusion rows and parallel-run rows.
  - name: fact_absence
    description: >
      Fusion absence entries and, from 2026-11-05, Oasis absences (staff_vacations through int_oasis_absence_entry,
      source Oasis): an Oasis entry that overlaps a counted Fusion absence of the same employee is left out.
    columns:
      - name: absence_key
        tests: [unique, not_null]
      - name: absence_type_key
        tests:
          - relationships: {to: ref('hnh_dim_absence_type'), field: absence_type_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: start_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: end_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_absence_daily
    description: >
      Fusion absence entries and, from 2026-11-05, Oasis absences (staff_vacations through int_oasis_absence_entry,
      source Oasis): an Oasis entry that overlaps a counted Fusion absence of the same employee is left out. Oasis days count once per staff and day.
    columns:
      - name: absence_day_key
        tests: [unique, not_null]
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: absence_type_key
        tests:
          - relationships: {to: ref('hnh_dim_absence_type'), field: absence_type_key}
  - name: fact_leave_balance_monthly
    description: >
      One row per Fusion balance entry; accrual periods are weekly running balances (several per month, some in the
      future). Monthly KPIs must filter is_latest_in_month = 1, current or latest-balance KPIs is_current_balance = 1
      (latest closed period, i.e. before today), and closed-period reporting is_closed_period = 1; summing all rows
      overstates the liability. Liability only exists for annual-leave plans with a salary.
      Oasis (2026-11-05): an employee-month without a Fusion annual-leave balance has one month-end row from
      int_oasis_leave_balance_monthly (source Oasis, plan Oasis Annual Leave); source says which system a row is from.
    columns:
      - name: leave_balance_key
        tests: [unique, not_null]
      - name: employee_key
        tests:
          - relationships: {to: ref('hnh_dim_employee'), field: employee_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: accrual_period_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: agg_staff_productivity_monthly
    tests:
      - hnh_unique_combination:
          columns: [staff_key, month_date_key]
    columns:
      - name: staff_key
        tests:
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: branch_key
        tests:
          - relationships: {to: ref('hnh_dim_branch'), field: branch_key}
      - name: month_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: dim_review_physician
    description: >
      Physician contract review columns, one row per dim_staff row (a separate model because bridge_employee_staff refs
      dim_staff). is_review_physician: an Oasis doctor linked to exactly one employee, not contingent, with a physician
      job in Fusion. review_physician_key: the home row's staff_key on a review physician's home row and on the rows of
      the same person in other hospitals (same staff_id, not linked to HR, national id equal or missing), -1 elsewhere.
      HR attributes read Not linked on a row without exactly one linked employee.
    columns:
      - name: staff_key
        tests:
          - unique
          - not_null
          - relationships: {to: ref('dim_staff'), field: staff_key}
      - name: is_review_physician
        tests: [not_null]
      - name: job_title
        tests: [not_null]
      - name: pay_grade
        tests: [not_null]
      - name: employment_type
        tests:
          - not_null
          - accepted_values:
              values: ['Full-time', 'Part-time', 'Not linked']
      - name: review_physician_key
        tests:
          - not_null
          - relationships: {to: ref('dim_staff'), field: staff_key}
  - name: hnh_fact_recruiting_requisition
    description: >
      Approved, not deleted Oracle Recruiting requisitions of the hospitals (branches 1-8) and Head Office (100;
      ruling R32) (bsc ssas spec 6.2, KPIs 47 and 48; HR dashboard). The scorecard (BSC Actual and its payload
      measures) keeps hospitals only; the standalone measures BSC Time to Fill (days), BSC Vacancy Rate and Open
      Openings include Head Office at network level.
      days_to_fill is NULL when not filled or filled before approval.
    columns:
      - name: requisition_id
        tests: [unique, not_null]
      - name: branch_key
        description: Branches 1-8 (hospitals) and 100 (Head Office); never 0 (Group).
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8, 100], quote: false}
  - name: dim_physician_review_metric
    description: The nine metrics of the physician contract review with section, unit and direction. Repo labels, not title-cased.
    columns:
      - name: metric_code
        tests: [unique, not_null]
      - name: section
        tests:
          - accepted_values: {values: ['Salary', 'Income']}
      - name: unit
        tests:
          - accepted_values: {values: ['sar', '%', 'n', 'x']}
      - name: direction
        tests:
          - accepted_values: {values: [-1, 0, 1], quote: false}
  - name: dim_peer_scope
    description: The two peer scopes of the physician contract review (same hospital, group). Repo labels, not title-cased.
    columns:
      - name: scope_code
        tests:
          - unique
          - not_null
          - accepted_values: {values: ['HOSPITAL', 'GROUP']}
