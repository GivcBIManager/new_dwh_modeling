version: 2

# HR dashboard configuration resolved for SSAS. Labels are repo-defined, not title-cased.
models:
  - name: dim_hr_kpi
    description: One row per HR dashboard KPI or metric, with its definition, source, target source and BSC link.
    columns:
      - name: hr_kpi_key
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
      - name: kpi_code
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
  - name: fact_hr_target_monthly
    description: Fixed HR KPI targets per hospital and month; the most specific config row wins.
    tests:
      - hnh_unique_combination:
          columns: [hr_kpi_key, branch_key, month_date_key]
          config: {severity: warn}
    columns:
      - name: hr_kpi_key
        tests:
          - relationships: {to: ref('dim_hr_kpi'), field: hr_kpi_key, config: {severity: warn}}
      - name: branch_key
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5, 6, 7, 8], quote: false, config: {severity: warn}}
  - name: dim_hr_dq_issue
    description: One row per HR data quality issue type, with where and how to fix it.
    columns:
      - name: hr_dq_issue_key
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
      - name: issue_code
        tests:
          - unique: {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
