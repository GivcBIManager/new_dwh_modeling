version: 2

unit_tests:
  - name: rec_claims_monthly_ignores_cancelled_claims_and_counts_recovery_once
    description: >
      Invoice 1000 was submitted three times (1 rejected, 2 partially approved, 3 latest and fully approved):
      the recovery is submission 3's approved amount only, not the sum over submissions 2 and 3. Invoice 2000's
      latest submission is cancelled (one line adjudicated, one pended), so it adds nothing to submitted,
      approved, rejected, adjudicated or pending. Invoice 3000 is a live pended claim. One payment has no
      statement date and is left out of the month. Early and nphies fees are summed with their sign.
    model: rec_claims_monthly
    given:
      - input: ref('fact_claim_line')
        format: sql
        rows: |
          select toUInt8(1) as branch_key, toInt32(20260630) as statement_end_date_key,
                 toFloat64(0) as legacy_submitted_amount, toFloat64(0) as legacy_approved_amount, toFloat64(0) as legacy_rejected_amount,
                 toFloat64(cl) as claimed_amount, toUInt8(1) as is_sent, toUInt64(sn) as submission_number,
                 toUInt8(lt) as is_latest_submission, toUInt8(cx) as is_cancelled_claim, st as adjudication_status,
                 toNullable(toFloat64(sub)) as submitted_amount, toNullable(toFloat64(ap)) as approved_amount,
                 toNullable(toFloat64(rj)) as rejected_amount
          from values('cl Float64, sn UInt32, lt UInt8, cx UInt8, st String, sub Float64, ap Float64, rj Float64',
              (100, 1, 0, 0, 'Adjudicated', 100, 0, 100),
              (100, 2, 0, 0, 'Adjudicated', 100, 40, 60),
              (100, 3, 1, 0, 'Adjudicated', 100, 100, 0),
              (500, 1, 1, 1, 'Adjudicated', 500, 300, 200),
              (70, 1, 1, 1, 'Pended', 0, 0, 0),
              (50, 1, 1, 0, 'Pended', 0, 0, 0))
      - input: ref('fact_claim_payment')
        format: sql
        rows: |
          select toUInt8(1) as branch_key, sk as statement_end_date_key,
                 toFloat64(amt) as payment_amount, toFloat64(ef) as early_fee, toFloat64(nf) as nphies_fee
          from values('sk Nullable(Int32), amt Float64, ef Float64, nf Float64',
              (20260630, 80, 5, -2), (20260630, 20, -1, 3), (NULL, 999, 9, 9))
    expect:
      format: sql
      rows: |
        select toUInt8(1) as branch_key, toDate('2026-06-01') as month_start,
               toFloat64(0) as legacy_submitted, toFloat64(0) as legacy_approved, toFloat64(0) as legacy_rejected,
               toFloat64(150) as submitted, toFloat64(100) as approved, toFloat64(0) as rejected,
               toFloat64(100) as adjudicated_submitted, toFloat64(300) as first_pass_rejected,
               toFloat64(600) as first_pass_adjudicated_submitted, toFloat64(100) as resubmission_recovery,
               toFloat64(50) as pending, toFloat64(100) as remitted, toFloat64(4) as remitted_early_fee, toFloat64(1) as remitted_nphies_fee

  - name: rec_orders_monthly_counts_new_and_legacy_scope
    description: >
      June, branch 1: an OP lost line, an OP delivered line (3 of 4 units), an OP line delivered by
      alternative that the old report also counted, an IP lost line (in new leak scope but excluded
      from the non-inpatient KPI and from legacy scope), and an OP excluded package, and an OP delivered unit outlier (5000 ordered, 1 delivered)
    model: rec_orders_monthly
    given:
      - input: ref('fact_order_line')
        format: sql
        rows: |
          select toUInt8(1) as branch_key, toInt32(20260615) as order_date_key, toUInt8(sc) as is_in_leak_scope,
                 toUInt8(lo) as is_lost, toUInt8(ip) as is_inpatient, toUInt8(xp) as is_excluded_package,
                 fs as fulfilment_status, toFloat64(uo) as units_ordered, toFloat64(ud) as units_delivered,
                 toUInt8(lsc) as legacy_in_scope, toUInt8(llo) as legacy_is_lost,
                 toUInt8(uout) as is_unit_outlier,
                 if(uo > 0, least(ud / uo, 1), cast(null as Nullable(Float64))) as unit_fulfilment_ratio
          from values('sc UInt8, lo UInt8, ip UInt8, xp UInt8, fs String, uo Float64, ud Float64, lsc UInt8, llo UInt8, uout UInt8',
              (1, 1, 0, 0, 'Undelivered', 1, 0, 1, 1, 0),
              (1, 0, 0, 0, 'Delivered', 4, 3, 1, 0, 0),
              (1, 0, 0, 0, 'Delivered by alternative', 1, 0, 1, 0, 0),
              (1, 1, 1, 0, 'Undelivered', 2, 0, 0, 0, 0),
              (0, 0, 0, 1, 'Undelivered', 1, 0, 0, 0, 0),
              (1, 0, 0, 0, 'Delivered', 5000, 1, 1, 0, 1))
    expect:
      rows:
        - {branch_key: 1, month_start: '2026-06-01', legacy_lines: 4, legacy_lost: 1, lines: 4, lost: 1, delivered_by_alternative: 1, delivered_by_substitute: 0, excluded_package_lines: 1, scope_units_ordered: 6, scope_units_delivered: 3, avg_unit_fulfilment_ratio: 0.18755, unit_outlier_lines: 1}

  - name: rec_gl_revenue_monthly_compares_gl_with_oasis
    description: >
      Branch 6, June 2026: GL OP revenue 1,000 less a contractual discount of 100 (net 900); an opening-balance
      revenue line of 5,000 is excluded. Oasis recognised revenue: OP 880 and day case 20, so the difference is 0.
    model: rec_gl_revenue_monthly
    given:
      - input: ref('hnh_fact_gl_journal_line')
        format: sql
        rows: |
          select toUInt8(6) as branch_key, toInt64(a) as gl_account_key, toInt32(202607) as period_key,
                 toUInt8(ob) as is_opening_balance_journal, toFloat64(amt) as amount
          from values('a UInt32, ob UInt8, amt Float64', (1, 0, -1000), (2, 0, 100), (1, 1, -5000))
      - input: ref('hnh_dim_gl_account')
        format: sql
        rows: |
          select toInt64(a) as gl_account_key, 'OP' as revenue_care_type, toInt64(f) as fs_line_key
          from values('a UInt32, f UInt32', (1, 91), (2, 92))
      - input: ref('dim_fs_line')
        format: sql
        rows: |
          select toInt64(f) as fs_line_key, g as statement_group, c as fs_caption
          from values('f UInt32, g String, c String', (91, 'Revenue', 'Revenue Cash'), (92, 'Revenue discounts', 'Revenue - Contractual Discounts'))
      - input: ref('hnh_dim_gl_period')
        format: sql
        rows: |
          select toInt32(202607) as period_key, toDate('2026-06-30') as end_date
      - input: ref('fact_charge_line')
        format: sql
        rows: |
          select toUInt8(6) as branch_key, toInt32(dk) as delivery_date_key, toInt8(ct) as care_type_key, toFloat64(r) as revenue_amount
          from values('dk Int32, ct Int8, r Float64', (20260615, 1, 880), (20260615, 4, 20), (20260710, 1, 500), (20260510, 1, 999))
      - input: ref('dim_care_type')
        format: sql
        rows: |
          select toInt8(k) as care_type_key, c as care_type from values('k Int8, c String', (1, 'OP'), (2, 'ER'), (3, 'IP'), (4, 'DAYCASE'), (-1, 'Unknown'))
    expect:
      rows:
        - {branch_key: 6, month_start: 2026-06-01, gl_revenue_op: 1000, gl_contractual_discount: 100, gl_net_revenue: 900, oasis_revenue_op: 880, oasis_revenue_daycase: 20, oasis_revenue_total: 900, difference: 0}
        - {branch_key: 6, month_start: 2026-07-01, gl_revenue_op: 0, gl_contractual_discount: 0, gl_net_revenue: 0, oasis_revenue_op: 500, oasis_revenue_daycase: 0, oasis_revenue_total: 500, difference: -500}
