version: 2

unit_tests:
  - name: stg_ref__hr_target_keeps_latest_row_flags_placeholders_and_drops_deleted_keys
    description: >
      HR_TURNOVER 2027 is set to 8, changed to 7, then deleted: no row. HR_OVERTIME 2026 is a placeholder, then confirmed as
      'HR 2026': the latest row wins and is_placeholder is 0. HR_SICK 2026 stays a placeholder: is_placeholder is 1.
    model: stg_ref__hr_target
    given:
      - input: source('reference', 'map_hr_target')
        format: sql
        rows: |
          select k as kpi_code, toUInt8(0) as branch_id, toUInt16(y) as year, toUInt8(0) as month, v as target_value,
                 v + 1 as watch_value, toUInt8(0) as scale_with_months, sb as source_basis, toDateTime64(t, 3) as changed_at,
                 'test' as changed_by, '' as change_note, toUInt8(d) as is_deleted
          from values('k String, y UInt16, v Float64, sb String, t String, d UInt8',
              ('HR_TURNOVER', 2027, 8, 'HR 2027', '2026-10-01 10:00:00', 0),
              ('HR_TURNOVER', 2027, 7, 'HR 2027', '2026-10-02 10:00:00', 0),
              ('HR_TURNOVER', 2027, 7, 'HR 2027', '2026-10-03 10:00:00', 1),
              ('HR_OVERTIME', 2026, 5, 'Placeholder - HR to confirm', '2026-10-01 10:00:00', 0),
              ('HR_OVERTIME', 2026, 4, ' HR 2026 ', '2026-10-02 10:00:00', 0),
              ('HR_SICK', 2026, 3, 'Placeholder - HR to confirm', '2026-10-01 10:00:00', 0))
    expect:
      format: sql
      rows: |
        select 'HR_OVERTIME' as kpi_code, toUInt8(0) as branch_id, toUInt16(2026) as year, toUInt8(0) as month,
               toFloat64(4) as target_value, toFloat64(5) as watch_value, toUInt8(0) as scale_with_months,
               'HR 2026' as source_basis, toUInt8(0) as is_placeholder,
               toDateTime64('2026-10-02 10:00:00', 3) as last_changed_at
        union all
        select 'HR_SICK', toUInt8(0), toUInt16(2026), toUInt8(0), toFloat64(3), toFloat64(4), toUInt8(0),
               'Placeholder - HR to confirm', toUInt8(1), toDateTime64('2026-10-01 10:00:00', 3)

  - name: stg_ref__hr_kpi_takes_the_latest_status
    description: HR_TURNOVER is seeded active, then parked by a later row; the code and text are trimmed.
    model: stg_ref__hr_kpi
    given:
      - input: source('reference', 'map_hr_kpi')
        format: sql
        rows: |
          select ' HR_TURNOVER ' as kpi_code, 'kpi' as kind, ' Turnover ' as kpi_name, 'Turnover' as short_label, 'Flow' as area,
                 '' as definition, '' as formula, 'Fusion' as source_system, '' as grain, '' as caveats, 'lower' as direction,
                 'pct' as value_format, toUInt16(1) as display_order, 'BSC Turnover' as measure_name, 'HR_TURNOVER' as bsc_kpi_code,
                 'bsc' as target_source, toUInt8(0) as needs_pay, toUInt8(1) as is_home_tile, st as status,
                 toDateTime64(t, 3) as changed_at, 'test' as changed_by, '' as change_note, toUInt8(0) as is_deleted
          from values('st String, t String', ('active', '2026-10-01 10:00:00'), ('parked', '2026-10-05 10:00:00'))
    expect:
      format: sql
      rows: |
        select 'HR_TURNOVER' as kpi_code, 'kpi' as kind, 'Turnover' as kpi_name, 'Turnover' as short_label, 'Flow' as area,
               '' as definition, '' as formula, 'Fusion' as source_system, '' as grain, '' as caveats, 'lower' as direction,
               'pct' as value_format, toUInt16(1) as display_order, 'BSC Turnover' as measure_name, 'HR_TURNOVER' as bsc_kpi_code,
               'bsc' as target_source, toUInt8(0) as needs_pay, toUInt8(1) as is_home_tile, 'parked' as status,
               toDateTime64('2026-10-05 10:00:00', 3) as last_changed_at

  - name: stg_ref__hr_dq_issue_takes_the_latest_row
    description: DQ_FTE_ZERO is seeded Medium, then raised to High by a later row; the code and text are trimmed.
    model: stg_ref__hr_dq_issue
    given:
      - input: source('reference', 'map_hr_dq_issue')
        format: sql
        rows: |
          select ' DQ_FTE_ZERO ' as issue_code, ' FTE is zero ' as issue_name, 'Data' as area, 'Fusion' as fix_in, 'HR' as owner,
                 sv as severity, 'Enter the FTE' as how_to_fix, toUInt16(1) as display_order, 'active' as status,
                 toDateTime64(t, 3) as changed_at, 'test' as changed_by, '' as change_note, toUInt8(0) as is_deleted
          from values('sv String, t String', ('Medium', '2026-10-01 10:00:00'), ('High', '2026-10-05 10:00:00'))
    expect:
      format: sql
      rows: |
        select 'DQ_FTE_ZERO' as issue_code, 'FTE is zero' as issue_name, 'Data' as area, 'Fusion' as fix_in, 'HR' as owner,
               'High' as severity, 'Enter the FTE' as how_to_fix, toUInt16(1) as display_order, 'active' as status,
               toDateTime64('2026-10-05 10:00:00', 3) as last_changed_at
