version: 2

models:
  - name: stg_ref__branch
    columns:
      - name: branch_id
        tests: [unique, not_null]
  - name: stg_ref__purchaser_mapping
    tests:
      - hnh_unique_combination:
          columns: [branch_id, purchaser_code]
  - name: stg_ref__referral_policy
    tests:
      - hnh_unique_combination:
          columns: [branch_id, purchaser_code, policy_code]
  - name: stg_ref__unified_department
    columns:
      - name: department
        tests: [unique, not_null]
      - name: unified_department
        tests: [not_null]
  - name: stg_ref__bed_classification
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_location]
    columns:
      - name: classification
        tests:
          - accepted_values:
              values: ["Critical", "Intermediate Care", "Non Critical", "Non-Admitting Unit"]
  - name: stg_ref__ward_tower
    tests:
      - hnh_unique_combination:
          columns: [branch_id, work_entity]
  - name: stg_ref__clinic_duration
    columns:
      - name: specialty
        tests: [unique, not_null]
  - name: stg_ref__clinic_count
    columns:
      - name: branch_id
        tests: [unique, not_null]
  - name: stg_ref__home_care_entity
    tests:
      - hnh_unique_combination:
          columns: [branch_id, work_entity]
  - name: stg_ref__termination_reason
    tests:
      - hnh_unique_combination:
          columns: [branch_id, termination_reason_code]
  - name: stg_ref__bi_users
    columns:
      - name: user_name
        tests: [not_null]
  - name: stg_ref__hijri_calendar
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: stg_ref__public_holiday
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: stg_ref__product_category
    tests:
      - hnh_unique_combination:
          columns: [branch_id, category_code]
  - name: stg_ref__claim_status
    columns:
      - name: detailed_status
        tests: [unique, not_null]
  - name: stg_ref__nphies_reason
    columns:
      - name: reason_code
        tests: [unique, not_null]
      - name: reason_category
        tests:
          - accepted_values:
              values: ['Technical and contractual', 'Appropriateness of care', 'Pharmacy Benefit Management', 'Duplicated Service', 'Fraud']
  - name: stg_ref__order_fulfilment_packages
    columns:
      - name: package_description
        tests: [unique, not_null]
  - name: stg_ref__fs_account
    columns:
      - name: natural_account
        tests: [unique, not_null]
      - name: fs_type
        tests:
          - accepted_values:
              values: ['BS', 'IS']
  - name: stg_ref__oasis_fs_account
    tests:
      - hnh_unique_combination:
          columns: [branch_id, code]
          config: {severity: warn}
  - name: stg_ref__fs_line_order
    tests:
      - hnh_unique_combination:
          columns: [level, value_lower]
    columns:
      - name: level
        tests:
          - accepted_values:
              values: ['type', 'element', 'category', 'caption']
      - name: statement_group
        tests:
          - accepted_values:
              values: ['Balance sheet', 'Revenue', 'Revenue discounts', 'Direct cost', 'G&A', 'Selling and marketing',
                       'Charges from head office', 'Other income', 'Depreciation and amortisation', 'Finance cost', 'Zakat', 'OCI']
  - name: stg_ref__budget_fs_line
    tests:
      - hnh_unique_combination:
          columns: [match_level, match_value_lower, care_type]
    columns:
      - name: match_level
        tests:
          - accepted_values:
              values: ['account', 'line', 'caption', 'category']
  - name: stg_ref__fusion_specialty_unified
    columns:
      - name: specialty_code
        tests: [unique, not_null]
  - name: stg_ref__income_statement_budget
    tests:
      - hnh_unique_combination:
          columns: [branch_id, fiscal_year, scenario, line_item_code, id]
  - name: stg_ref__pay_category
    tests:
      - hnh_unique_combination:
          columns: [source, source_code, payable_type]
    columns:
      - name: source
        tests:
          - accepted_values:
              values: ['oasis', 'fusion']
      - name: pay_category
        tests:
          - accepted_values:
              values: ['Basic', 'Housing', 'Transport', 'Food', 'Clinical allowances', 'Other allowances', 'Overtime',
                       'Leave pay', 'End of service', 'Awards and bonus', 'Absence and lateness deduction',
                       'GOSI employer charge', 'Other employer charges', 'GOSI employee deduction', 'Loans and advances',
                       'Other deductions', 'Not pay', 'Unmapped']
  - name: stg_ref__payroll_cutover
    columns:
      - name: branch_id
        tests: [unique, not_null]
  - name: stg_ref__scm_cutover
    columns:
      - name: branch_id
        tests: [unique, not_null]
  - name: stg_ref__store_department
    tests:
      - hnh_unique_combination:
          columns: [source, branch_id, store_code]
    columns:
      - name: source
        tests:
          - accepted_values:
              values: ['oasis', 'fusion']
      - name: store_type
        tests:
          - accepted_values:
              values: ['Warehouse', 'Pharmacy', 'Operating room', 'Ward', 'Clinic', 'Laboratory', 'Radiology',
                       'Administration', 'Support', 'Asset', 'Expiry/damaged/recall', 'Unmapped']
  - name: stg_ref__item_group
    columns:
      - name: category_code
        tests: [unique, not_null]
      - name: item_group
        tests:
          - accepted_values:
              values: ['Medication', 'Medical consumable', 'Implant', 'Laboratory', 'General', 'Asset', 'Other']
  - name: stg_ref__stock_snapshot
  - name: stg_ref__pg_question_role
    tests:
      - hnh_unique_combination:
          columns: [service_code, question_code]
    columns:
      - name: role
        tests:
          - accepted_values:
              values: ['Hospital NPS', 'Physician NPS', 'respondent', 'first_visit', 'booking_channel', 'admitted_via_er',
                       'used_lab', 'used_radiology', 'used_pharmacy', 'used_insurance_office', 'used_physio', 'used_speech',
                       'treatment_complete', 'meds_delivered', 'tele_spared_visit', 'tele_channel', 'hhc_service',
                       'dental_service', 'dialysis_done', 'contact_consent']
  - name: stg_ref__pg_background_value
    tests:
      - hnh_unique_combination:
          columns: [service_code, question_code, answer_code]
    columns:
      - name: conformed_value
        tests: [not_null]
