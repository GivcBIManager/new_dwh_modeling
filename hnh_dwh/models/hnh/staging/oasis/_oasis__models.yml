version: 2

models:
  - name: stg_oasis__codes_data
    tests:
      - hnh_unique_combination:
          columns: [branch_id, code]
  - name: stg_oasis__work_entities
    tests:
      - hnh_unique_combination:
          columns: [branch_id, work_entity]
  - name: stg_oasis__service_departments
    tests:
      - hnh_unique_combination:
          columns: [branch_id, service_dept]
  - name: stg_oasis__cost_centres
    tests:
      - hnh_unique_combination:
          columns: [branch_id, cost_centre_id]
  - name: stg_oasis__purchasers
    tests:
      - hnh_unique_combination:
          columns: [branch_id, purchaser_code]
  - name: stg_oasis__external_accounts
    tests:
      - hnh_unique_combination:
          columns: [branch_id, account_code, account_type, c_id]
  - name: stg_oasis__eligibility_types
    tests:
      - hnh_unique_combination:
          columns: [branch_id, eligibility_type]
  - name: stg_oasis__er_priorities
    tests:
      - hnh_unique_combination:
          columns: [branch_id, priority]
  - name: stg_oasis__patients
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_id]
  - name: stg_oasis__patient_files
    tests:
      - hnh_unique_combination:
          columns: [branch_id, pat_file_id]
  - name: stg_oasis__patient_ids
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_id_seq]
  - name: stg_oasis__staff
    tests:
      - hnh_unique_combination:
          columns: [branch_id, staff_id]
    columns:
      - name: staff_id
        tests: [not_null]
  - name: stg_oasis__staff_posts
    tests:
      - hnh_unique_combination:
          columns: [branch_id, post_number, started_at]
  - name: stg_oasis__positions
    tests:
      - hnh_unique_combination:
          columns: [branch_id, position_type]
  - name: stg_oasis__staff_types
    tests:
      - hnh_unique_combination:
          columns: [branch_id, staff_type]
  - name: stg_oasis__staff_contracts
    tests:
      - hnh_unique_combination:
          columns: [branch_id, staff_contract_no]
  - name: stg_oasis__personnel_documents
    tests:
      - hnh_unique_combination:
          columns: [branch_id, document_id]
  - name: stg_oasis__bed_slots
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_location]
  - name: stg_oasis__bed_classes
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_class]
  - name: stg_oasis__bed_details
    tests:
      - hnh_unique_combination:
          columns: [branch_id, bed_detail_id]
  - name: stg_oasis__appointments
    tests:
      - hnh_unique_combination:
          columns: [branch_id, appointment_id]
          config:
            where: "patient_id is not null"
  - name: stg_oasis__er_visits
    tests:
      - hnh_unique_combination:
          columns: [branch_id, er_visit_id]
  - name: stg_oasis__admissions
    tests:
      - hnh_unique_combination:
          columns: [branch_id, admission_no]
  - name: stg_oasis__admission_requests
    tests:
      - hnh_unique_combination:
          columns: [branch_id, admission_request_id]
  - name: stg_oasis__episodes
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_id, episode_no]
  - name: stg_oasis__eligibility
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_eligibility_id]
  - name: stg_oasis__bill_agreements
    tests:
      - hnh_unique_combination:
          columns: [branch_id, patient_id, episode_no, responsibility_seq]
  - name: stg_oasis__operating_slots
    tests:
      - hnh_unique_combination:
          columns: [branch_id, operating_slot_code]
          config:
            where: "patient_id is not null"
  - name: stg_oasis__operations
    tests:
      - hnh_unique_combination:
          columns: [branch_id, operating_slot_code, operation_seq]
  - name: stg_oasis__service_items
    tests:
      - hnh_unique_combination:
          columns: [branch_id, ios_main]
  - name: stg_oasis__charges
    tests:
      - hnh_unique_combination:
          columns: [branch_id, delivery_charge_id]
  - name: stg_oasis__delivery_lines
    tests:
      - hnh_unique_combination:
          columns: [branch_id, delivery_line]
  - name: stg_oasis__master_deliveries
    tests:
      - hnh_unique_combination:
          columns: [branch_id, master_delivery_no]
  - name: stg_oasis__ar_documents
    tests:
      - hnh_unique_combination:
          columns: [branch_id, doc_id]
    columns:
      - name: doc_type
        tests:
          - accepted_values:
              values: ['INVOICEAR', 'CREDITAR', 'DEBITAR', 'RECEIPT']
  - name: stg_oasis__episode_invoices
    tests:
      - hnh_unique_combination:
          columns: [branch_id, invoice_no]
  - name: stg_oasis__invoice_statements
    tests:
      - hnh_unique_combination:
          columns: [branch_id, stat_invoice_no]
  - name: stg_oasis__ios_master
    tests:
      - hnh_unique_combination:
          columns: [branch_id, ios]
  - name: stg_oasis__policies
    tests:
      - hnh_unique_combination:
          columns: [branch_id, policy_code]
  - name: stg_oasis__authorisation_requests
    tests:
      - hnh_unique_combination:
          columns: [branch_id, request_no]
  - name: stg_oasis__authorisations
    tests:
      - hnh_unique_combination:
          columns: [branch_id, authorisation_no]
  - name: stg_oasis__preauth_api_requests
    tests:
      - hnh_unique_combination:
          columns: [branch_id, api_trans_id]
  - name: stg_oasis__preauth_api_request_items
    tests:
      - hnh_unique_combination:
          columns: [branch_id, request_item_id]
  - name: stg_oasis__preauth_api_responses
    tests:
      - hnh_unique_combination:
          columns: [branch_id, response_id]
  - name: stg_oasis__preauth_api_response_items
    tests:
      - hnh_unique_combination:
          columns: [branch_id, response_item_id]
  - name: stg_oasis__claim_visits
    tests:
      - hnh_unique_combination:
          columns: [branch_id, visit_id]
  - name: stg_oasis__claim_services
    tests:
      - hnh_unique_combination:
          columns: [branch_id, visit_id, sequence_no]
  - name: stg_oasis__pull_responses
    tests:
      - hnh_unique_combination:
          columns: [branch_id, response_id]
    columns:
      - name: response_type
        tests:
          - accepted_values:
              values: ['claim-response', 'priorauth-response', 'advanced-authorization', 'payment-reconciliation']
