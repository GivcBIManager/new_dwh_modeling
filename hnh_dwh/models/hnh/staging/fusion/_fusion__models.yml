version: 2

models:
  - name: stg_fusion__gl_journal_lines
    tests:
      - hnh_unique_combination:
          columns: [je_header_id, je_line_num]
  - name: stg_fusion__gl_accounts
    columns:
      - name: code_combination_id
        tests: [unique, not_null]
  - name: stg_fusion__coa_segment_values
    tests:
      - hnh_unique_combination:
          columns: [segment_column_name, segment_value]
  - name: stg_fusion__gl_periods
    columns:
      - name: period_name
        tests: [unique, not_null]
  - name: stg_fusion__gl_balances
    tests:
      - hnh_unique_combination:
          columns: [code_combination_id, period_name]
  - name: stg_fusion__ap_invoice_distributions
    columns:
      - name: invoice_distribution_id
        tests: [unique, not_null]
  - name: stg_fusion__ap_payments
    columns:
      - name: invoice_payment_id
        tests: [unique, not_null]
  - name: stg_fusion__ap_payment_schedules
    columns:
      - name: invoice_id
        tests: [unique, not_null]
      - name: currency_code
        tests:
          - accepted_values:
              values: ['SAR']
              config: {severity: warn}
  - name: stg_fusion__suppliers
    tests:
      - hnh_unique_combination:
          columns: [vendor_id, vendor_site_id]
  - name: stg_fusion__business_units
    columns:
      - name: business_unit_id
        tests: [unique, not_null]
  - name: stg_fusion__employees
    tests:
      - hnh_unique_combination:
          columns: [person_id, valid_from]
  - name: stg_fusion__assignments
    tests:
      - hnh_unique_combination:
          columns: [assignment_id, valid_from]
  - name: stg_fusion__periods_of_service
    columns:
      - name: period_of_service_id
        tests: [unique, not_null]
  - name: stg_fusion__worker_movements
    tests:
      - hnh_unique_combination:
          columns: [assignment_id, effective_end_date_key, effective_sequence]
  - name: stg_fusion__work_measures
    columns:
      - name: assign_work_measure_id
        tests: [not_null]
  - name: stg_fusion__hr_departments
    columns:
      - name: organization_id
        tests: [unique, not_null]
  - name: stg_fusion__organizations
    columns:
      - name: organization_id
        tests: [unique, not_null]
  - name: stg_fusion__jobs
    columns:
      - name: job_id
        tests: [unique, not_null]
  - name: stg_fusion__grades
    columns:
      - name: grade_id
        tests: [unique, not_null]
  - name: stg_fusion__positions
    columns:
      - name: position_id
        tests: [unique, not_null]
  - name: stg_fusion__locations
    columns:
      - name: location_id
        tests: [unique, not_null]
  - name: stg_fusion__worker_actions
    tests:
      - hnh_unique_combination:
          columns: [action_code, action_reason_code]
  - name: stg_fusion__payroll_run_results
    tests:
      - hnh_unique_combination:
          columns: [run_result_id, input_value_id]
  - name: stg_fusion__payroll_elements
    columns:
      - name: element_type_id
        tests: [unique, not_null]
  - name: stg_fusion__payroll_input_values
    columns:
      - name: input_value_id
        tests: [unique, not_null]
  - name: stg_fusion__absence_entries
    columns:
      - name: absence_entry_id
        tests: [unique, not_null]
  - name: stg_fusion__absence_types
    columns:
      - name: absence_type_id
        tests: [unique, not_null]
  - name: stg_fusion__absence_plans
    columns:
      - name: absence_plan_id
        tests: [unique, not_null]
  - name: stg_fusion__absence_balances
    columns:
      - name: accrual_entry_id
        tests: [unique, not_null]
  - name: stg_fusion__inventory_orgs
    columns:
      - name: organization_id
        tests: [unique, not_null]
  - name: stg_fusion__subinventories
    tests:
      - hnh_unique_combination:
          columns: [organization_id, subinventory_code]
  - name: stg_fusion__items
    tests:
      - hnh_unique_combination:
          columns: [inventory_item_id, organization_id]
  - name: stg_fusion__item_categories
    tests:
      - hnh_unique_combination:
          columns: [inventory_item_id, organization_id]
  - name: stg_fusion__inventory_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]
  - name: stg_fusion__inventory_transaction_lots
    tests:
      - hnh_unique_combination:
          columns: [transaction_id, lot_number]
  - name: stg_fusion__inventory_valuation
    columns:
      - name: layer_cost_id
        tests: [unique, not_null]
  - name: stg_fusion__inventory_onhand
    tests:
      - hnh_unique_combination:
          columns: [snapshot_date, onhand_quantities_id]
  - name: stg_fusion__inv_transaction_types
    columns:
      - name: transaction_type_id
        tests: [unique, not_null]
  - name: stg_fusion__lots
    tests:
      - hnh_unique_combination:
          columns: [inventory_item_id, organization_id, lot_number]
  - name: stg_fusion__cost_distributions
    columns:
      - name: distribution_line_id
        tests: [unique, not_null]
  - name: stg_fusion__po_distributions
    columns:
      - name: po_distribution_id
        tests: [unique, not_null]
  - name: stg_fusion__po_schedules
    columns:
      - name: line_location_id
        tests: [unique, not_null]
  - name: stg_fusion__po_line_types
    columns:
      - name: line_type_id
        tests: [unique, not_null]
  - name: stg_fusion__receipt_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]
  - name: stg_fusion__requisition_distributions
    columns:
      - name: distribution_id
        tests: [unique, not_null]
